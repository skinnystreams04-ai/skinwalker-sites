<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игры - Тир-лист</title>
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/site-header.css">
    <script src="../shared/site-header.js"></script>
    <script src="../shared/twitch-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>
    <style>
        /* ГЛОБАЛЬНЫЕ ЦВЕТА */
        :root {
            --theme-primary: #a6e3a1;
            --theme-glow: rgba(166, 227, 161, 0.5);
            --theme-panel-border: #283325;
            --btn-color: #a6e3a1;
        }

        body { margin: 0; font-family: 'Neucha', cursive; background: #0b0d0a; color: #a4b09c; min-height: 100vh; padding-bottom: 50px; }

        /* ГЛОБАЛЬНЫЙ ПЕРЕКЛЮЧАТЕЛЬ САЙТОВ (ЛОГОТИП) */
        .logo-dropdown { position: relative; display: inline-block; padding: 5px 0; }
        .nav-logo-wrap { display: flex; align-items: center; gap: 8px; color: var(--theme-primary, #a6e3a1); font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--theme-glow, rgba(166, 227, 161, 0.5)); cursor: pointer; transition: 0.3s; font-family: 'Neucha', cursive; }
        .nav-logo-wrap:hover { filter: brightness(1.2); }
        .logo-arrow { font-size: 14px; opacity: 0.7; transition: transform 0.3s; }
        .logo-dropdown:hover .logo-arrow { transform: rotate(180deg); }
        
        .logo-dropdown-content { display: none; position: absolute; left: 0; top: 100%; margin-top: -5px; background: rgba(14, 17, 13, 0.95); border: 1px solid var(--theme-panel-border, #283325); border-radius: 12px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 200px; backdrop-filter: blur(10px); flex-direction: column; gap: 5px; }
        .logo-dropdown:hover .logo-dropdown-content { display: flex; }
        
        .logo-link { color: #a4b09c; text-decoration: none; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; text-transform: uppercase; padding: 10px 15px; border-radius: 8px; transition: 0.3s; text-align: left; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
        .logo-link:hover { background: rgba(0,0,0,0.4); color: var(--site-color); text-shadow: 0 0 10px var(--site-color); border-color: var(--site-color); }
        .logo-link.active { color: var(--site-color); background: rgba(0,0,0,0.3); border-left: 3px solid var(--site-color); border-radius: 4px 8px 8px 4px; }

        /* ШАПКА */
        .top-nav { background: #0b0d0a; border-bottom: 2px solid var(--theme-panel-border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); position: relative; z-index: 1000; transition: border-color 0.5s ease; }
        
        .nav-logo { color: var(--theme-primary); font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; text-shadow: 0 0 10px var(--theme-glow); transition: color 0.5s ease, text-shadow 0.5s ease; cursor: pointer; }
        .nav-logo:hover { filter: brightness(1.2); }
        
        .nav-btn { background: transparent; border: none; color: #a4b09c; padding: 5px 0; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; position: relative; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; outline: none; }
        .nav-btn::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 50%; background-color: var(--btn-color, #a6e3a1); transition: 0.3s; transform: translateX(-50%); box-shadow: 0 0 8px var(--btn-color, #a6e3a1); }
        .nav-btn:hover { color: var(--btn-color, #a6e3a1); text-shadow: 0 0 10px var(--btn-color, #a6e3a1); }
        .nav-btn:hover::after { width: 100%; }
        
        .nav-btn.active::after { width: 100%; }
        .btn-hub:hover { --btn-color: #ffd700; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .btn-visual:hover { --btn-color: #a6e3a1; color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.5); }

        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 8px; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; letter-spacing: 1px;}
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.8); }

        /* ПРОФИЛЬ ТВИЧА */
        .user-profile-neon { display: flex; align-items: center; gap: 18px; background: rgba(15, 20, 15, 0.2); backdrop-filter: blur(16px); padding: 10px 25px 10px 10px; border-radius: 12px; border: 1px solid var(--theme-panel-border); box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: 0.3s ease; }
        .user-profile-neon:hover { background: rgba(15, 20, 15, 0.3); border-color: rgba(166, 227, 161, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 15px rgba(166, 227, 161, 0.1); }
        .avatar-glow-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
        .avatar-glow-wrap::before { content: ''; position: absolute; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color, #a6e3a1); filter: blur(10px); opacity: 0.3; transition: 0.3s; }
        .user-profile-neon:hover .avatar-glow-wrap::before { opacity: 0.6; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--user-color, #a6e3a1); position: relative; z-index: 2; object-fit: cover; }
        .profile-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .profile-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .profile-bottom { display: flex; align-items: center; gap: 15px; }
        .role-badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .role-sub { background: #6441a5; color: #fff; border: 1px solid #4a307a; } 
        .role-vip { background: #e05e85; color: #fff; border: 1px solid #b83d63; } 
        .role-f { background: #333333; color: #a4b09c; border: 1px solid #222; } 
        .wallet-item { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .wallet-item img { width: 18px; height: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .logout-neon { background: transparent; border: none; color: rgba(255, 85, 85, 0.6); font-family: inherit; font-size: 15px; text-transform: uppercase; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 0; letter-spacing: 1px;}
        .logout-neon:hover { color: #ff5555; text-shadow: 0 0 12px rgba(255, 85, 85, 0.8); transform: scale(1.05); }

        /* ВЫПАДАЮЩЕЕ МЕНЮ ВИЗУАЛА */
        .visual-dropdown { position: relative; display: inline-block; }
        .visual-dropdown-content { display: none; position: absolute; right: 0; top: 100%; margin-top: 15px; background: rgba(14, 17, 13, 0.95); border: 1px solid #4a5c41; border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 250px; backdrop-filter: blur(10px); flex-direction: column; gap: 15px; }
        .visual-dropdown.show .visual-dropdown-content { display: flex; }
        .role-toggles { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 0; }
        .role-toggle-btn { background: transparent; border: none; border-bottom: 2px solid rgba(107, 122, 98, 0.3); color: #6b7a62; padding: 4px 2px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; outline: none; }
        .role-toggle-btn:hover { color: #c4d1b8; border-bottom-color: rgba(196, 209, 184, 0.5); }
        .role-toggle-btn.active.streamer { color: #cba6f7; border-bottom-color: #cba6f7; text-shadow: 0 0 8px rgba(203, 166, 247, 0.6); }
        .role-toggle-btn.active.me { color: #a6e3a1; border-bottom-color: #a6e3a1; text-shadow: 0 0 8px rgba(166, 227, 161, 0.6); }
        .role-toggle-btn.active.chat { color: #b8a87b; border-bottom-color: #b8a87b; text-shadow: 0 0 8px rgba(184, 168, 123, 0.6); }

        /* ОСНОВА ТИР-ЛИСТА */
        .tier-board { position: relative; margin: 20px 40px; display: flex; flex-direction: column; background: #0b0d0a; border: 1px solid var(--theme-panel-border); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; transition: border-color 0.5s ease; user-select: none; }
        .board-header { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: center; padding: 20px 30px; background: rgba(14, 17, 13, 0.8); border-bottom: 1px solid var(--theme-panel-border); transition: border-color 0.5s ease; }
        .board-title { font-family: 'Neucha', cursive; color: var(--theme-primary); font-size: 28px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--theme-glow); transition: color 0.5s ease, text-shadow 0.5s ease; }
        
        /* ВКЛАДКИ */
        .tier-tabs { display: flex; gap: 20px; align-items: center; }
        .tier-tab { background: transparent; border: none; color: #6b7a62; font-family: 'Neucha', cursive; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; outline: none; padding: 5px 0; border-bottom: 2px solid transparent; }
        .tier-tab:hover { color: var(--tab-color, #c4d1b8); }
        .tier-tab.active { color: var(--tab-color, #a6e3a1); border-bottom: 2px solid var(--tab-color, #a6e3a1); text-shadow: 0 0 10px var(--tab-glow, rgba(166, 227, 161, 0.5)); }
        #tab-streamer { --tab-color: #cba6f7; --tab-glow: rgba(203, 166, 247, 0.5); }
        #tab-me { --tab-color: #a6e3a1; --tab-glow: rgba(166, 227, 161, 0.5); }
        #tab-chat { --tab-color: #ffd700; --tab-glow: rgba(255, 215, 0, 0.5); }

        #tier-content-area { position: relative; z-index: 2; }
        .tier-row { display: flex; background: rgba(0,0,0,0.2); border-bottom: 1px solid #1a2217; min-height: 140px; transition: background 0.3s, box-shadow 0.3s; }
        .tier-row:last-child { border-bottom: none; }
        
        .tier-label { width: 100px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; flex-shrink: 0; box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 2; transition: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .tier-content { display: flex; flex-wrap: wrap; gap: 12px; padding: 15px; flex: 1; align-content: flex-start; min-height: 120px; transition: 0.3s; }
        
        /* БЭКЛОГ */
        .backlog-container { margin: 20px 40px; background: rgba(14, 17, 13, 0.5); border: 1px dashed var(--theme-panel-border); border-radius: 12px; padding: 25px 15px 15px 15px; min-height: 130px; position: relative; transition: border-color 0.5s ease; display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; z-index: 2; }
        .backlog-title { position: absolute; top: -12px; left: 30px; background: #0b0d0a; padding: 0 15px; color: var(--theme-primary); font-size: 16px; font-weight: bold; text-transform: uppercase; border: 1px solid var(--theme-panel-border); border-radius: 6px; letter-spacing: 1px; transition: color 0.5s ease, border-color 0.5s ease; }

        /* КАРТОЧКА ИГРЫ */
        .tier-item { width: 120px; height: 180px; border-radius: 6px; position: relative; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); background-size: cover; background-position: center; transition: all 0.2s ease-out; border: 2px solid transparent; user-select: none; -webkit-user-drag: element; }
        .tier-item:hover { transform: scale(1.1) translateY(-5px); z-index: 10; box-shadow: 0 10px 20px rgba(0,0,0,0.8), 0 0 15px var(--theme-light, rgba(255,255,255,0.1)); border-color: var(--theme-light, rgba(255,255,255,0.3)); }
        .tier-item:active { transform: scale(1.05); opacity: 0.9; z-index: 20; box-shadow: 0 0 20px var(--theme-light, #a6e3a1); border-color: var(--theme-light, #a6e3a1); }
        .tier-item.dragging { opacity: 0.5 !important; transform: scale(1.05); z-index: 99; pointer-events: none; }

        .drag-over { background: rgba(255, 255, 255, 0.03); box-shadow: inset 0 0 30px rgba(0,0,0,0.8); }
        .drag-over .tier-label { filter: brightness(1.3); transform: scale(1.05); }
        .backlog-container.drag-over { border-color: #a6e3a1; background: rgba(166, 227, 161, 0.05); }

        .front-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 6px 6px 6px; box-sizing: border-box; background: linear-gradient(0deg, rgba(11,13,10,1) 0%, rgba(11,13,10,0.8) 50%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
        .game-title { color: var(--theme-light, #e4e4e4); font-size: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; text-shadow: 2px 2px 4px #000, 0 0 10px rgba(0,0,0,0.8); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.1; transition: color 0.3s; pointer-events: none; user-select: none; }

        /* ДИНАМИЧЕСКИЙ ФОН */
        #dynamic-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(40px); opacity: 0; z-index: 0; pointer-events: none; transition: opacity 0.5s ease, background-image 0.5s ease; }
        #dynamic-bg.active { opacity: 0.15; }
        
        /* ОКНО ЗАЛА СЛАВЫ (ЗРИТЕЛИ) */
        .leaderboard-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .leaderboard-box { background: #0b0d0a; border: 2px solid #a6e3a1; border-radius: 12px; width: 600px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(166,227,161,0.2); position: relative; }
        .leaderboard-header { padding: 25px 20px; border-bottom: 1px solid #283325; text-align: center; font-size: 26px; font-weight: bold; color: #a6e3a1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(166,227,161,0.5); flex-shrink: 0; font-family: 'Neucha', cursive; }
        .leaderboard-list { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; }
        .lb-item { display: flex; align-items: center; justify-content: space-between; background: rgba(14, 17, 13, 0.8); border: 1px solid #283325; padding: 12px 20px; border-radius: 8px; transition: 0.3s; text-decoration: none; }
        .lb-item:hover { transform: scale(1.02); border-color: #a6e3a1; background: rgba(166,227,161,0.05); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .lb-rank { font-size: 24px; font-weight: bold; font-family: sans-serif; color: #6b7a62; width: 45px; text-align: center; }
        .lb-rank.top-1 { color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.8); font-size: 32px; }
        .lb-rank.top-2 { color: #c0c0c0; text-shadow: 0 0 15px rgba(192,192,192,0.8); font-size: 28px; }
        .lb-rank.top-3 { color: #cd7f32; text-shadow: 0 0 15px rgba(205,127,50,0.8); font-size: 26px; }
        .lb-user { display: flex; align-items: center; gap: 15px; flex: 1; margin-left: 15px; }
        .lb-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .lb-name { font-size: 22px; font-weight: bold; font-family: 'Neucha', cursive, sans-serif; }
        .lb-stats { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .lb-count { font-size: 26px; font-weight: bold; color: #fff; line-height: 1; font-family: 'Neucha', cursive, sans-serif; }
        .lb-count-label { font-size: 11px; color: #6b7a62; text-transform: uppercase; font-family: sans-serif; font-weight: bold; letter-spacing: 1px; margin-top: 4px; }
    </style>
</head>
<body>

    <nav class="top-nav">
        <!-- ЛЕВАЯ ЧАСТЬ (ПЕРЕКЛЮЧАТЕЛЬ САЙТОВ И КНОПКИ) -->
        <div style="display: flex; align-items: center; gap: 40px;">
            
            <!-- ГЛОБАЛЬНЫЙ ПЕРЕКЛЮЧАТЕЛЬ САЙТОВ -->
            <div class="logo-dropdown">
                <div class="nav-logo-wrap">Skinwalker Игры <span class="logo-arrow">▼</span></div>
                <div class="logo-dropdown-content">
                    <a href="../anime/index.html" class="logo-link" style="--site-color: #a6e3a1;">
                        <span style="font-size: 14px;">▶</span> Аниме
                    </a>
                    <a href="index.html" class="logo-link active" style="--site-color: #ffd700;">
                        <span style="font-size: 14px;">▶</span> Игры
                    </a>
                </div>
            </div>
            
            <div style="display: flex; gap: 20px; align-items: center;">
                <a href="index.html" class="nav-btn btn-hub">Хаб</a>
                <a href="games-tierlist.html" class="nav-btn active" style="color: #ff4a4a; text-shadow: 0 0 8px rgba(255,74,74,0.5); --btn-color: #ff4a4a;">Тир-лист</a>
                <button onclick="openLeaderboard()" class="nav-btn" style="--btn-color: #89b4fa;">Зрители</button>
                
                <div class="visual-dropdown" id="visual-dropdown">
                    <button class="nav-btn btn-visual" onclick="toggleVisualMenu()">Визуал</button>
                    <div class="visual-dropdown-content">
                        <div class="role-toggles" style="margin: 0; justify-content: center; flex-wrap: wrap;">
                            <button id="toggle-streamer" class="role-toggle-btn active streamer" onclick="toggleRoleVis('streamer')">Стример</button>
                            <button id="toggle-me" class="role-toggle-btn active me" onclick="toggleRoleVis('me')">Я</button>
                            <button id="toggle-chat" class="role-toggle-btn active chat" onclick="toggleRoleVis('chat')">Чат</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- РџР РђР'РђРЇ Р§РђРЎРўР¬ -->
        <div class="nav-auth" id="nav-auth">
            <button class="twitch-btn" onclick="loginTwitch()">Войти через Twitch</button>
        </div>
    </nav>

    <div class="tier-board" style="position: relative;">
        <div id="dynamic-bg"></div>
        
        <div class="board-header" style="position: relative; z-index: 1;">
            <div class="board-title">Игровой Тир-лист</div>
            <div class="tier-tabs">
                <button class="tier-tab active" onclick="switchTierTab('streamer')" id="tab-streamer">Стример</button>
                <button class="tier-tab" onclick="switchTierTab('me')" id="tab-me">Я</button>
                <button class="tier-tab" onclick="switchTierTab('chat')" id="tab-chat">Чат</button>
            </div>
        </div>
        
        <div id="tier-content-area" style="position: relative; z-index: 1;">
            <div class="tier-row" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-tier="S">
                <div class="tier-label" style="background: #ff4a4a20; border-right: 2px solid #ff4a4a; color: #ff4a4a; text-shadow: 0 0 15px #ff4a4a;">S</div>
                <div class="tier-content"></div>
            </div>
            <div class="tier-row" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-tier="A">
                <div class="tier-label" style="background: #ffd70020; border-right: 2px solid #ffd700; color: #ffd700; text-shadow: 0 0 15px #ffd700;">A</div>
                <div class="tier-content"></div>
            </div>
            <div class="tier-row" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-tier="B">
                <div class="tier-label" style="background: #cba6f720; border-right: 2px solid #cba6f7; color: #cba6f7; text-shadow: 0 0 15px #cba6f7;">B</div>
                <div class="tier-content"></div>
            </div>
            <div class="tier-row" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-tier="C">
                <div class="tier-label" style="background: #89b4fa20; border-right: 2px solid #89b4fa; color: #89b4fa; text-shadow: 0 0 15px #89b4fa;">C</div>
                <div class="tier-content"></div>
            </div>
            <div class="tier-row" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-tier="D">
                <div class="tier-label" style="background: #a6e3a120; border-right: 2px solid #a6e3a1; color: #a6e3a1; text-shadow: 0 0 15px #a6e3a1;">D</div>
                <div class="tier-content"></div>
            </div>
            <div class="tier-row" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-tier="F">
                <div class="tier-label" style="background: #88888820; border-right: 2px solid #888888; color: #888888; text-shadow: 0 0 15px #888888;">F</div>
                <div class="tier-content"></div>
            </div>
        </div>
    </div>

    <!-- БЭКЛОГ ИГР -->
    <div class="backlog-container" ondrop="drop(event)" ondragover="allowDrop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)" data-tier="UNRANKED">
        <div class="backlog-title">Бэклог / Без оценки</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЗРИТЕЛЕЙ -->
    <div id="leaderboard-modal" class="leaderboard-overlay" style="display: none;" onclick="if(event.target===this) this.style.display='none'">
        <div class="leaderboard-box" style="height: 700px;">
            <div class="close-btn" style="position: absolute; top: 15px; right: 20px; font-size: 32px; color: #a6e3a1; cursor: pointer; transition: 0.2s; z-index: 10;" onclick="document.getElementById('leaderboard-modal').style.display='none'" onmouseover="this.style.color='#ff5555'" onmouseout="this.style.color='#a6e3a1'">Г—</div>
            <div class="leaderboard-header" style="border-bottom: none; padding-bottom: 15px;">Зал славы зрителей</div>
            <div style="padding: 0 20px 15px 20px; border-bottom: 1px solid #283325;">
                <input type="text" id="lb-search" class="search-input" style="width: 100%; box-sizing: border-box; background: rgba(0,0,0,0.5); border: 1px solid #4a5c41; border-radius: 8px; padding: 12px 15px; color: #c4d1b8; outline: none; font-family: 'Neucha', cursive; font-size: 16px;" placeholder="Введите никнейм для поиска..." oninput="filterLeaderboard()">
            </div>
            <div class="leaderboard-list" id="leaderboard-list"></div>
        </div>
    </div>

    <script>
        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = '../game/index.html'; 
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';
        const FIREBASE_DB_URL = "https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app/games_db.json";

        let currentUser = null;
        window.globalUsersDB = {};
        window.globalCommData = null;

        // --- 1. АВТОРИЗАЦИЯ И ПРОФИЛЬ ---
        function loginTwitch() { window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=`; }
        function logoutTwitch() { try { localStorage.removeItem('twitch_token'); } catch(e){} location.reload(); }

        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB ? window.globalUsersDB[lowerName] : null;
            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            if (dbUser) {
                if (dbUser.role) r = dbUser.role.toUpperCase();
                if (dbUser.wallet_gold) g = dbUser.wallet_gold;
                if (dbUser.wallet_tickets) t = dbUser.wallet_tickets;
                if (dbUser.color && dbUser.color.trim() !== "") c = dbUser.color;
            }
            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (r === 'SUB' || r === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`;
            else if (r === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;
            return { role: r, gold: g, tickets: t, color: c, badge: badgeHtml };
        }

        async function checkTwitchAuth() {
            try {
                fetch(`${FIREBASE_BASE}/global_users.json`, { cache: 'no-store' })
                    .then(res => res.json())
                    .then(data => { window.globalUsersDB = data || {}; renderProfileUI(); })
                    .catch(e => console.log(e));

                const hash = window.location.hash;
                let token = null;
                try { token = localStorage.getItem('twitch_token'); } catch(e){}

                if (hash && hash.includes('access_token')) {
                    token = new URLSearchParams(hash.substring(1)).get('access_token');
                    try { localStorage.setItem('twitch_token', token); } catch(e){}
                    window.history.replaceState(null, null, window.location.pathname + window.location.search);
                }

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': 'Bearer ' + token } });
                    if (res.status === 401) { try { localStorage.removeItem('twitch_token'); } catch(e){} return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': 'Bearer ' + token } });
                        const colorData = await colorRes.json();
                        currentUser.color = (colorData.data && colorData.data[0] && colorData.data[0].color) ? colorData.data[0].color : null;
                    } catch(e) {}
                    
                    renderProfileUI();
                }
            } catch (e) { console.error('Ошибка авторизации', e); }
        }

        function renderProfileUI() {
            if (!currentUser) return;
            const uInfo = getUserInfo(currentUser.login, currentUser.color);
            const authDiv = document.getElementById('nav-auth');
            if (authDiv) {
                authDiv.innerHTML = `
                    <div class="user-profile-neon">
                        <div class="avatar-glow-wrap" style="--user-color: ${uInfo.color}; cursor: pointer; transition: 0.2s;" onclick="window.location.href='profile.html?user=${currentUser.id}'" title="Мой профиль">
                            <img src="${currentUser.profile_image_url}" class="user-avatar">
                        </div>
                        <div class="profile-info">
                            <div class="profile-top">
                                <span class="profile-name-top" style="color: ${uInfo.color}; text-shadow: 0 0 8px ${uInfo.color}; cursor: pointer;" onclick="window.location.href='profile.html?user=${currentUser.id}'">${currentUser.display_name}</span>
                                <button class="logout-neon" onclick="logoutTwitch()">Выйти</button>
                            </div>
                            <div class="profile-bottom">
                                ${uInfo.badge}
                                <div class="wallet-item" style="color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);">
                                    <img src="../icons/BILET_GOLD.png" onerror="this.style.display='none'"> <span>${uInfo.gold}</span>
                                </div>
                                <div class="wallet-item" style="color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.3);">
                                    <img src="../icons/BILET.png" onerror="this.style.display='none'"> <span>${uInfo.tickets}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // --- 2. МЕНЮ ВИЗУАЛА ---
        let visRoles = JSON.parse(localStorage.getItem('skinwalker_vis_roles')) || { streamer: true, me: true, chat: true };

        function toggleVisualMenu() { document.getElementById('visual-dropdown').classList.toggle('show'); }
        window.addEventListener('click', function(e) {
            if (!document.getElementById('visual-dropdown').contains(e.target)) {
                document.getElementById('visual-dropdown').classList.remove('show');
            }
        });

        function applyVisualToggles() {
            const tabS = document.getElementById('tab-streamer');
            const tabM = document.getElementById('tab-me');
            const tabC = document.getElementById('tab-chat');
            
            // Скрываем или показываем вкладки в шапке тир-листа
            if (tabS) tabS.style.display = visRoles.streamer ? 'block' : 'none';
            if (tabM) tabM.style.display = visRoles.me ? 'block' : 'none';
            if (tabC) tabC.style.display = visRoles.chat ? 'block' : 'none';

            // Если текущая вкладка была выключена в меню - перекидываем на первую доступную
            if (!visRoles[currentTierTab]) {
                if (visRoles.streamer) switchTierTab('streamer');
                else if (visRoles.me) switchTierTab('me');
                else if (visRoles.chat) switchTierTab('chat');
            }
        }

        function toggleRoleVis(role) {
            visRoles[role] = !visRoles[role];
            localStorage.setItem('skinwalker_vis_roles', JSON.stringify(visRoles)); 
            document.getElementById(`toggle-${role}`).classList.toggle('active', visRoles[role]);
            applyVisualToggles();
        }

        window.addEventListener('DOMContentLoaded', () => {
            Object.keys(visRoles).forEach(role => {
                const btn = document.getElementById(`toggle-${role}`);
                if (btn) btn.classList.toggle('active', visRoles[role]);
            });
            applyVisualToggles();
        });

        // --- 3. ЗАГРУЗКА И ОТРИСОВКА ИГР ---
        let gamesData = {};
        const tierColors = { 'S': '255, 74, 74', 'A': '255, 215, 0', 'B': '203, 166, 247', 'C': '137, 180, 250', 'D': '166, 227, 161', 'F': '136, 136, 136' };

        async function loadTierList() {
            try {
                const res = await fetch(FIREBASE_DB_URL);
                gamesData = await res.json() || {};
                
                document.querySelectorAll('.tier-content').forEach(el => el.innerHTML = '');
                const backlog = document.querySelector('.backlog-container');
                backlog.innerHTML = '<div class="backlog-title">Бэклог / Без оценки</div>';

                document.querySelectorAll('.tier-row').forEach(row => {
                    const tier = row.getAttribute('data-tier');
                    const rgb = tierColors[tier];
                    if (rgb) {
                        row.style.background = `linear-gradient(90deg, rgba(0,0,0,0.2) 0px, rgba(0,0,0,0.2) 100px, rgba(${rgb}, 0.12) 100px, rgba(0,0,0,0.2) 600px)`;
                        row.style.borderBottom = `1px solid rgba(${rgb}, 0.3)`; 
                    }
                });

                const gamesArray = Object.entries(gamesData).map(([id, data]) => ({ id, ...data }));
                gamesArray.forEach(game => {
                    const card = document.createElement('div');
                    card.className = 'tier-item';
                    card.id = game.id;
                    card.title = game.title;
                    card.style.backgroundImage = `url('${game.coverUrl}')`;
                    card.setAttribute('data-cover', game.coverUrl); 
                    card.draggable = false; // БЛОКИРУЕМ ПО УМОЛЧАНИЮ ДЛЯ ВСЕХ
                    
                    card.addEventListener('click', (e) => {
                        if (window.isDraggingCard) { e.preventDefault(); return; }
                        window.location.href = `games-page.html?id=${encodeURIComponent(game.id).replace(/'/g, "%27")}`;
                    });
                    
                    card.addEventListener('mouseenter', () => {
                        if (window.isDraggingCard) return; 
                        const bg = document.getElementById('dynamic-bg');
                        bg.style.backgroundImage = `url('${game.coverUrl}')`;
                        bg.classList.add('active');
                        if (card.dataset.rgb) {
                            const rgb = card.dataset.rgb;
                            document.documentElement.style.setProperty('--theme-primary', `rgb(${rgb})`);
                            document.documentElement.style.setProperty('--theme-glow', `rgba(${rgb}, 0.5)`);
                            document.documentElement.style.setProperty('--theme-panel-border', `rgba(${rgb}, 0.4)`);
                        }
                    });
                    
                    card.addEventListener('mouseleave', () => {
                        document.getElementById('dynamic-bg').classList.remove('active');
                        document.documentElement.style.removeProperty('--theme-primary');
                        document.documentElement.style.removeProperty('--theme-glow');
                        document.documentElement.style.removeProperty('--theme-panel-border');
                    });
                    
                    card.innerHTML = `<div class="front-overlay"><div class="game-title">${game.title}</div></div>`;
                    backlog.appendChild(card);
                });
                
                extractCoverColors();
                renderBoardState();
            } catch (e) { console.error("Ошибка загрузки базы:", e); }
        }

        function extractCoverColors() {
            if (typeof ColorThief === 'undefined') return;
            const colorThief = new ColorThief();
            document.querySelectorAll('.tier-item').forEach(card => {
                const imgUrl = card.getAttribute('data-cover');
                if (!imgUrl) return;
                const processColor = (imgEl) => {
                    try {
                        const color = colorThief.getColor(imgEl);
                        let r = color[0], g = color[1], b = color[2];
                        const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                        if (luminance < 90) { r = Math.min(255, r + 80); g = Math.min(255, g + 80); b = Math.min(255, b + 80); }
                        card.style.setProperty('--theme-light', `rgb(${r}, ${g}, ${b})`); card.dataset.rgb = `${r}, ${g}, ${b}`;
                    } catch(e) { applyFallback(); }
                };
                const applyFallback = () => { card.style.setProperty('--theme-light', `rgb(166, 227, 161)`); card.dataset.rgb = `166, 227, 161`; };
                const hiddenImg = new Image(); hiddenImg.crossOrigin = 'Anonymous';
                hiddenImg.onload = () => processColor(hiddenImg);
                hiddenImg.onerror = function() {
                    const proxyImg = new Image(); proxyImg.crossOrigin = 'Anonymous';
                    proxyImg.onload = () => processColor(proxyImg);
                    proxyImg.onerror = function() { const proxyImg2 = new Image(); proxyImg2.crossOrigin = 'Anonymous'; proxyImg2.onload = () => processColor(proxyImg2); proxyImg2.onerror = applyFallback; proxyImg2.src = 'https://wsrv.nl/?url=' + encodeURIComponent(imgUrl); };
                    proxyImg.src = 'https://corsproxy.io/?' + encodeURIComponent(imgUrl);
                };
                hiddenImg.src = imgUrl + '?bypassCache=' + Date.now();
            });
        }

        // --- 4. ВКЛАДКИ И АВТОМАТИЧЕСКАЯ ДОСКА ---
        let currentTierTab = 'streamer';

        async function switchTierTab(tabName) {
            if (tabName === 'me' && !currentUser) { alert('Сначала авторизуйтесь через Twitch!'); return; }
            currentTierTab = tabName;
            
            document.querySelectorAll('.tier-tab').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // Подгружаем оценки для "Я" и "Чат"
            if ((tabName === 'me' || tabName === 'chat') && !window.globalCommData) {
                document.getElementById(`tab-${tabName}`).innerText = "...";
                try {
                    const res = await fetch(`${FIREBASE_BASE}/games_community_db.json`);
                    window.globalCommData = await res.json() || {};
                } catch(e) {}
                document.getElementById(`tab-${tabName}`).innerText = tabName === 'me' ? 'Я' : 'Чат';
            }
            
            renderBoardState(); 
        }

        // Формула перевода 10 баллов в букву
        function getAutoTier(score) {
            if (score >= 9.0) return 'S';
            if (score >= 8.0) return 'A';
            if (score >= 7.0) return 'B';
            if (score >= 5.0) return 'C';
            if (score >= 3.0) return 'D';
            if (score > 0) return 'F';
            return 'UNRANKED';
        }

        function renderBoardState() {
            const backlog = document.querySelector('.backlog-container');
            const gamesArray = Object.entries(gamesData).map(([id, data]) => ({ id, ...data }));
            const isStreamer = currentUser && currentUser.login.toLowerCase() === 'skinwalker_nozxc';

            gamesArray.forEach(game => {
                let tier = 'UNRANKED'; 
                let sortValue = 0;

                if (currentTierTab === 'streamer') {
                    tier = game.scores?.tier || 'UNRANKED';
                    sortValue = game.scores?.position || 999; 
                } 
                else if (currentTierTab === 'me') {
                    if (currentUser && window.globalCommData && window.globalCommData[game.id]?.ratings?.[currentUser.id]) {
                        const ovr = Number(window.globalCommData[game.id].ratings[currentUser.id].overall) || 0;
                        tier = getAutoTier(ovr);
                        sortValue = -ovr; 
                    }
                } 
                else if (currentTierTab === 'chat') {
                    if (window.globalCommData && window.globalCommData[game.id]?.ratings) {
                        let sum = 0, count = 0;
                        Object.values(window.globalCommData[game.id].ratings).forEach(r => {
                            const ovr = Number(r.overall) || 0;
                            if (ovr > 0) { sum += ovr; count++; }
                        });
                        const avg = count > 0 ? (sum / count) : 0;
                        tier = getAutoTier(avg);
                        sortValue = -avg;
                    }
                }

                game._tempTier = tier; 
                game._tempSort = sortValue;
            });

            gamesArray.sort((a, b) => a._tempSort - b._tempSort);

            gamesArray.forEach(game => {
                const card = document.getElementById(game.id);
                if (!card) return;
                
                // Раздаем права на перетаскивание (Только стримеру и только на вкладке "Стример")
                if (isStreamer && currentTierTab === 'streamer') {
                    card.draggable = true;
                    card.style.cursor = 'grab';
                } else {
                    card.draggable = false;
                    card.style.cursor = 'pointer';
                }

                if (game._tempTier === 'UNRANKED') backlog.appendChild(card);
                else {
                    const row = document.querySelector(`.tier-row[data-tier="${game._tempTier}"] .tier-content`);
                    if (row) row.appendChild(card);
                }
            });
        }

        // --- 5. ФИЗИКА ПЕРЕТАСКИВАНИЯ (ТОЛЬКО ДЛЯ СТРИМЕРА) ---
        window.isDraggingCard = false;
        document.addEventListener('dragstart', drag);
        document.addEventListener('dragend', dragEnd);

        function drag(ev) {
            const isStreamer = currentUser && currentUser.login.toLowerCase() === 'skinwalker_nozxc';
            if (!isStreamer || currentTierTab !== 'streamer') {
                ev.preventDefault();
                return;
            }

            window.isDraggingCard = true; 
            const card = ev.target.closest('.tier-item');
            if (!card) return;
            ev.dataTransfer.setData("text", card.id);
            ev.dataTransfer.effectAllowed = "move";
            setTimeout(() => { card.classList.add('dragging'); }, 0);
        }

        function dragEnd(ev) {
            const card = ev.target.closest('.tier-item');
            if (card) card.classList.remove('dragging');
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
            
            const isStreamer = currentUser && currentUser.login.toLowerCase() === 'skinwalker_nozxc';
            if (isStreamer && currentTierTab === 'streamer') {
                updateTierOrder();
            }
            setTimeout(() => { window.isDraggingCard = false; }, 100);
        }

        function allowDrop(ev) {
            const isStreamer = currentUser && currentUser.login.toLowerCase() === 'skinwalker_nozxc';
            if (!isStreamer || currentTierTab !== 'streamer') return;

            ev.preventDefault();
            let dropzone = ev.target.closest('.tier-row, .backlog-container');
            if (dropzone) {
                dropzone.classList.add('drag-over');
                let targetZone = dropzone.classList.contains('backlog-container') ? dropzone : dropzone.querySelector('.tier-content');
                const afterElement = getDragAfterElement(targetZone, ev.clientX, ev.clientY);
                const draggable = document.querySelector('.dragging');
                if (draggable) {
                    if (afterElement == null) targetZone.appendChild(draggable);
                    else targetZone.insertBefore(draggable, afterElement);
                }
            }
        }

        function getDragAfterElement(container, x, y) {
            const draggableElements = [...container.querySelectorAll('.tier-item:not(.dragging)')];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const inRow = y >= box.top - 15 && y <= box.bottom + 15;
                if (!inRow) return closest; 
                const offset = x - (box.left + box.width / 2);
                if (offset < 0 && offset > closest.offset) return { offset: offset, element: child };
                else return closest;
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function dragEnter(ev) { 
            const isStreamer = currentUser && currentUser.login.toLowerCase() === 'skinwalker_nozxc';
            if (isStreamer && currentTierTab === 'streamer') ev.preventDefault(); 
        }
        function dragLeave(ev) {
            let dropzone = ev.target.closest('.tier-row, .backlog-container');
            if (dropzone && !dropzone.contains(ev.relatedTarget)) dropzone.classList.remove('drag-over');
        }
        function drop(ev) {
            const isStreamer = currentUser && currentUser.login.toLowerCase() === 'skinwalker_nozxc';
            if (isStreamer && currentTierTab === 'streamer') ev.preventDefault();
            let dropRow = ev.target.closest('.tier-row, .backlog-container');
            if (dropRow) dropRow.classList.remove('drag-over');
        }

        // --- 6. СОХРАНЕНИЕ ПОРЯДКА СТРИМЕРА ---
        async function updateTierOrder() {
            const updates = {};
            document.querySelectorAll('.tier-row').forEach(row => {
                const tier = row.getAttribute('data-tier');
                row.querySelectorAll('.tier-item').forEach((card, index) => {
                    updates[`${card.id}/scores/tier`] = tier;
                    updates[`${card.id}/scores/position`] = index + 1;
                });
            });
            document.querySelectorAll('.backlog-container .tier-item').forEach(card => {
                updates[`${card.id}/scores/tier`] = 'UNRANKED';
                updates[`${card.id}/scores/position`] = 0;
            });

            try {
                await fetch(FIREBASE_DB_URL, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updates) });
            } catch(e) {}
        }

        // --- 7. ЗАЛ СЛАВЫ ЗРИТЕЛЕЙ ---
        let lbAllUsers = [];

        async function openLeaderboard() {
            const btn = document.querySelector('button[onclick="openLeaderboard()"]');
            const oldText = btn ? btn.innerText : 'Зрители';
            if (btn) btn.innerText = "Загрузка...";
            
            let commDataToUse = window.globalCommData;
            if (!commDataToUse) {
                try {
                    const res = await fetch(`${FIREBASE_BASE}/games_community_db.json`);
                    commDataToUse = await res.json() || {};
                    window.globalCommData = commDataToUse; 
                } catch(e) {}
            }
            if (btn) btn.innerText = oldText;

            const userStats = {};
            if (commDataToUse && typeof commDataToUse === 'object') {
                for (const [gameId, gameData] of Object.entries(commDataToUse)) {
                    if (gameData && gameData.ratings && typeof gameData.ratings === 'object') {
                        for (const [userId, rating] of Object.entries(gameData.ratings)) {
                            if (!rating) continue;
                            const ov = Number(rating.overall) || 0;
                            let hasTheory = false;
                            if (rating.theory && typeof rating.theory === 'object') {
                                hasTheory = Object.values(rating.theory).some(v => Number(v) > 0);
                            }
                            if (ov > 0 || hasTheory || rating.tier) {
                                if (!userStats[userId]) { 
                                    userStats[userId] = { id: userId, name: rating.displayName || userId, avatar: rating.profileImage || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png', count: 0 }; 
                                }
                                userStats[userId].count++;
                                if (rating.displayName) userStats[userId].name = rating.displayName;
                                if (rating.profileImage) userStats[userId].avatar = rating.profileImage;
                            }
                        }
                    }
                }
            }
            lbAllUsers = Object.values(userStats).sort((a, b) => b.count - a.count);
            const searchInput = document.getElementById('lb-search');
            if (searchInput) searchInput.value = '';
            renderLeaderboard(lbAllUsers);
            const modal = document.getElementById('leaderboard-modal');
            if (modal) modal.style.display = 'flex';
        }

        function renderLeaderboard(usersArray) {
            const listEl = document.getElementById('leaderboard-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            if (usersArray.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: #6b7a62; padding: 30px; font-size: 18px;">Никого не найдено.</div>'; 
                return;
            }
            usersArray.forEach((u) => {
                const originalIndex = lbAllUsers.findIndex(orig => orig.id === u.id);
                const rank = originalIndex + 1;
                let rankClass = ''; let crown = rank;
                if (rank === 1) { rankClass = 'top-1'; crown = '🥇'; }
                else if (rank === 2) { rankClass = 'top-2'; crown = '🥈'; }
                else if (rank === 3) { rankClass = 'top-3'; crown = '🥉'; }
                const safeName = (u.name || '').toString().toLowerCase();
                const dbUser = window.globalUsersDB ? window.globalUsersDB[safeName] : null;
                const color = (dbUser && dbUser.color) ? dbUser.color : '#a4b09c';
                const isOnline = dbUser && dbUser.last_online && (Date.now() - dbUser.last_online < 150000);
                const statusDot = isOnline ? '<div class="status-dot status-online" style="display:inline-block; margin-right:6px;"></div><span style="color:#a6e3a1; font-size:13px; font-family:sans-serif;">В сети</span>' : '<div class="status-dot status-offline" style="display:inline-block; margin-right:6px;"></div><span style="color:#6b7a62; font-size:13px; font-family:sans-serif;">Не в сети</span>';
                const html = `
                <a href="profile.html?user=${u.id}" class="lb-item">
                    <div class="lb-rank ${rankClass}">${crown}</div>
                    <div class="lb-user">
                        <img src="${u.avatar}" class="lb-avatar" style="border-color: ${color};">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <div class="lb-name" style="color: ${color}; text-shadow: 0 0 8px ${color}80; line-height: 1;">${u.name}</div>
                            <div style="display: flex; align-items: center;">${statusDot}</div>
                        </div>
                    </div>
                    <div class="lb-stats">
                        <div class="lb-count">${u.count}</div>
                        <div class="lb-count-label">оценок</div>
                    </div>
                </a>`;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        }

        function filterLeaderboard() {
            const searchInput = document.getElementById('lb-search');
            if (!searchInput) return;
            const query = searchInput.value.toLowerCase().trim();
            if (!query) { renderLeaderboard(lbAllUsers); return; }
            const filtered = lbAllUsers.filter(u => (u.name || '').toString().toLowerCase().includes(query));
            renderLeaderboard(filtered);
        }

        // Запуск
        window.onload = () => {
            checkTwitchAuth();
            loadTierList();
        };
    </script>
</body>
</html>
