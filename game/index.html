    <style>
        /* ГЛОБАЛЬНЫЕ ЦВЕТА И ХАМЕЛЕОН */
        :root {
            --theme-primary: #a6e3a1;
            --theme-glow: rgba(166, 227, 161, 0.5);
            --theme-panel-border: #283325;
            --btn-color: #a6e3a1;
        }

        /* ГЛОБАЛЬНЫЙ ПЕРЕКЛЮЧАТЕЛЬ САЙТОВ (ЛОГОТИП) */
        .logo-dropdown { position: relative; display: inline-block; padding: 10px 0; }
        .nav-logo-wrap { display: flex; align-items: center; gap: 8px; color: var(--theme-primary, #a6e3a1); font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--theme-glow, rgba(166, 227, 161, 0.5)); cursor: pointer; transition: 0.3s; font-family: 'Neucha', cursive; }

        .logo-arrow { font-size: 14px; opacity: 0.7; transition: transform 0.3s; }
        .logo-dropdown:hover .logo-arrow { transform: rotate(180deg); }
        
        .logo-dropdown-content { display: none; position: absolute; left: 0; top: 100%; margin-top: -5px; background: rgba(14, 17, 13, 0.95); border: 1px solid var(--theme-panel-border, #283325); border-radius: 12px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 200px; backdrop-filter: blur(10px); flex-direction: column; gap: 5px; }

        .logo-link { color: #a4b09c; text-decoration: none; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; text-transform: uppercase; padding: 10px 15px; border-radius: 8px; transition: 0.3s; text-align: left; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
        .logo-link:hover { background: rgba(0,0,0,0.4); color: var(--site-color); text-shadow: 0 0 10px var(--site-color); border-color: var(--site-color); }
        .logo-link.active { color: var(--site-color); background: rgba(0,0,0,0.3); border-left: 3px solid var(--site-color); border-radius: 4px 8px 8px 4px; }

        body { margin: 0; padding: 0 0 40px 0; font-family: 'Neucha', cursive, sans-serif; background-color: #0b0d0a; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E"); color: #a4b09c; min-height: 100vh; overflow-x: hidden; }

        .top-nav, .nav-logo, .hub-right-panel, .controls-bar, .search-input, .sort-select { transition: color 0.5s ease, text-shadow 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease !important; }

        .top-nav { background: #0b0d0a; border-bottom: 2px solid var(--theme-panel-border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 5px 20px rgba(0,0,0,0.5); position: relative; z-index: 1000; }
        
        .nav-btn { background: transparent; border: none; color: #a4b09c; padding: 5px 0; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; transition: color 0.5s ease, text-shadow 0.5s ease; position: relative; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; outline: none; }
        .nav-btn::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -6px; left: 50%; background-color: var(--btn-color, #a6e3a1); transition: width 0.3s ease, background-color 0.5s ease, box-shadow 0.5s ease; transform: translateX(-50%); box-shadow: 0 0 8px var(--btn-color, #a6e3a1); }
        .nav-btn:hover { color: var(--btn-color, #a6e3a1); text-shadow: 0 0 10px var(--btn-color, #a6e3a1); }
        .nav-btn:hover::after, .nav-btn.active::after { width: 100%; }

        .btn-tier:hover { --btn-color: #ff4a4a; color: #ff4a4a; text-shadow: 0 0 10px rgba(255, 74, 74, 0.5); }
        .btn-visual:hover { --btn-color: #a6e3a1; color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.5); }

        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 8px; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; letter-spacing: 1px;}
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.8); }
        
        .user-profile-neon { display: flex; align-items: center; gap: 18px; background: rgba(15, 20, 15, 0.2); backdrop-filter: blur(16px); padding: 10px 25px 10px 10px; border-radius: 12px; border: 1px solid var(--theme-panel-border); box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: 0.3s ease; }
        .user-profile-neon:hover { background: rgba(15, 20, 15, 0.3); border-color: rgba(166, 227, 161, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 15px rgba(166, 227, 161, 0.1); }
        .avatar-glow-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
        .avatar-glow-wrap::before { content: ''; position: absolute; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color, #a6e3a1); filter: blur(10px); opacity: 0.3; transition: 0.3s; }
        .user-profile-neon:hover .avatar-glow-wrap::before { opacity: 0.6; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--user-color, #a6e3a1); position: relative; z-index: 2; object-fit: cover; }
        .profile-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .profile-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .profile-name-top { font-family: 'Neucha', cursive; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        .profile-bottom { display: flex; align-items: center; gap: 15px; }
        .role-badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .role-sub { background: #6441a5; color: #fff; border: 1px solid #4a307a; } 
        .role-vip { background: #e05e85; color: #fff; border: 1px solid #b83d63; }
        .role-f { background: #333333; color: #a4b09c; border: 1px solid #222; }
        .wallet-item { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .wallet-item img { width: 18px; height: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .logout-neon { background: transparent; border: none; color: rgba(255, 85, 85, 0.6); font-size: 15px; text-transform: uppercase; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 0; letter-spacing: 1px; font-family: 'Neucha', cursive;}
        .logout-neon:hover { color: #ff5555; text-shadow: 0 0 12px rgba(255, 85, 85, 0.8); transform: scale(1.05); }

        /* ВЫПАДАЮЩЕЕ МЕНЮ ВИЗУАЛА */
        .visual-dropdown { position: relative; display: inline-block; }
        .visual-dropdown-content { display: none; position: absolute; left: 50%; transform: translateX(-50%); top: 100%; margin-top: 15px; background: rgba(14, 17, 13, 0.95); border: 1px solid var(--theme-panel-border); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 250px; backdrop-filter: blur(10px); flex-direction: column; gap: 15px; }
        .visual-dropdown.show .visual-dropdown-content { display: flex; }
        .role-toggles { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 0; }
        .role-toggle-btn { background: transparent; border: none; border-bottom: 2px solid rgba(107, 122, 98, 0.3); color: #6b7a62; padding: 4px 2px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; outline: none; }
        .role-toggle-btn:hover { color: #c4d1b8; border-bottom-color: rgba(196, 209, 184, 0.5); }
        .role-toggle-btn.active.streamer { color: #cba6f7; border-bottom-color: #cba6f7; text-shadow: 0 0 8px rgba(203, 166, 247, 0.6); }
        .role-toggle-btn.active.me { color: #a6e3a1; border-bottom-color: #a6e3a1; text-shadow: 0 0 8px rgba(166, 227, 161, 0.6); }
        .role-toggle-btn.active.chat { color: #b8a87b; border-bottom-color: #b8a87b; text-shadow: 0 0 8px rgba(184, 168, 123, 0.6); }

        .controls-bar { display: flex; justify-content: flex-start; align-items: center; gap: 15px; padding: 12px 25px; margin: 0 40px 30px 40px; background: rgba(14, 17, 13, 0.4); backdrop-filter: blur(15px); border: 1px solid var(--theme-panel-border); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: border-color 0.5s ease, box-shadow 0.5s ease; }
        .controls-divider { width: 1px; height: 30px; background: var(--theme-panel-border); margin: 0 10px; transition: 0.5s ease; }
        .search-input, .sort-select { background: transparent; border: none; border-bottom: 1px solid var(--theme-panel-border); color: #c4d1b8; padding: 8px 12px; font-family: 'Neucha', cursive; font-size: 18px; outline: none; border-radius: 0; transition: border-color 0.5s ease, box-shadow 0.5s ease;}
        .search-input { width: 250px; }
        .search-input::placeholder { color: #6b7a62; }
        .sort-select { cursor: pointer; appearance: none; padding-right: 30px; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23829c73%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 10px top 50%; background-size: 12px auto; }
        .sort-select option { background: #0b0d0a; color: #c4d1b8; }
        .search-input:focus, .sort-select:focus { border-bottom: 1px solid var(--theme-primary); box-shadow: 0 5px 15px -5px var(--theme-glow); }
        .sort-dir-btn { background: transparent; border: none; color: #6b7a62; padding: 0 5px 0 15px; font-family: sans-serif; font-size: 24px; font-weight: bold; cursor: pointer; outline: none; transition: 0.2s; display: flex; justify-content: center; align-items: center; line-height: 1; }
        .sort-dir-btn:hover { color: var(--theme-primary); text-shadow: 0 0 10px var(--theme-glow); transform: translateY(-3px); }

        .main-layout { display: flex; gap: 30px; padding: 0 40px; max-width: 100%; margin: 0 auto; align-items: flex-start; width: 100%; box-sizing: border-box; }
        .trophy-room { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; background: rgba(14, 17, 13, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid var(--theme-panel-border); border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); align-content: flex-start; transition: border-color 0.5s ease, box-shadow 0.5s ease; }
        
        .hub-right-panel { width: 420px; flex-shrink: 0; background: #0b0d0a; border: 2px solid var(--theme-panel-border); border-radius: 12px; position: sticky; top: 20px; min-height: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; transition: border-color 0.5s ease, box-shadow 0.5s ease; }
        .preview-placeholder { padding: 40px 20px; text-align: center; color: #6b7a62; font-size: 18px; display: flex; height: 100%; align-items: center; justify-content: center; }
        .preview-cover { width: 100%; height: 200px; object-fit: cover; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%); mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%); border-bottom: 2px solid var(--theme-panel-border); transition: border-color 0.5s ease; }
        .preview-content { padding: 0 20px 20px 20px; margin-top: -60px; position: relative; z-index: 2; display: flex; flex-direction: column; }
        .preview-title { font-size: 24px; font-weight: bold; color: #fff; text-transform: uppercase; line-height: 1.1; text-align: center; transition: color 0.4s; text-shadow: 2px 2px 5px #000; }

        .card-container { width: 100%; aspect-ratio: 2 / 3; position: relative; max-width: 220px; justify-self: center; }
        .card-container::before { content: ''; position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; background: var(--card-color); filter: blur(40px); opacity: 0.15; z-index: -1; transition: 0.5s; border-radius: 50%; }
        .card-container:hover::before { opacity: 0.35; transform: scale(1.05); }

        .card-face { position: absolute; width: 100%; height: 100%; border-radius: 12px; overflow: hidden; background-size: cover; background-position: center; display: flex; flex-direction: column; transition: 0.3s; border: 2px solid var(--card-border); box-shadow: 0 0 15px var(--card-shadow); cursor: pointer; }
        .card-container:hover .card-face { border-color: var(--card-color); box-shadow: 0 0 30px var(--card-shadow-hover); transform: translateY(-8px); }
        
        .ep-badge { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: rgba(11, 13, 10, 0.6); backdrop-filter: blur(8px); border: 1px solid var(--card-border); color: var(--theme-light, #c4d1b8); font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 6px; z-index: 10; letter-spacing: 1px; box-shadow: 0 4px 10px rgba(0,0,0,0.8); text-transform: uppercase; text-shadow: 1px 1px 2px #000; transition: 0.5s; white-space: nowrap; }
        .front-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 10px 10px 10px; box-sizing: border-box; background: linear-gradient(0deg, var(--overlay-solid, rgba(11, 13, 10, 1)) 0%, var(--overlay-fade, rgba(11, 13, 10, 0.95)) 60%, rgba(11, 13, 10, 0) 100%); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
        
        .scores-row { display: flex; justify-content: space-between; align-items: stretch; margin-bottom: 6px; gap: 6px; }
        .score-box { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px 2px; border-radius: 6px; flex: 1; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); transition: 0.3s;}
        .score-label { width: 100%; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 2px; margin-bottom: 2px; font-size: 11px; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; text-shadow: 1px 1px 2px #000; text-align: center; }
        .main-score { font-size: 24px; font-weight: bold; line-height: 1; letter-spacing: 2px; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000; text-align: center; font-family: 'Neucha', cursive, sans-serif;}
        .main-score span { font-size: 11px; color: #c4d1b8; text-shadow: none !important; letter-spacing: normal; }

        .divider { border-top: 1px dashed #4a5c41; margin: 6px 0 8px 0; }
        .game-title { color: var(--theme-light, #c4d1b8); font-size: 14px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; text-shadow: 0 0 10px var(--card-shadow-hover), 2px 2px 5px #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-overflow: ellipsis; width: 100%; line-height: 1.2; transition: 0.5s; }

        .theory-container { background: transparent; border: none; padding: 0; }
        .loading { font-size: 24px; color: #829c73; text-align: center; margin-top: 50px; width: 100%; grid-column: 1 / -1; }

        #dynamic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(40px) brightness(0.2); opacity: 0; z-index: -1; pointer-events: none; transition: opacity 0.5s ease, background-image 0.5s ease; }
        #dynamic-bg.active { opacity: 1; }

        /* ЗАЛ СЛАВЫ И ПОИСК */
        .leaderboard-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .leaderboard-box { background: #0b0d0a; border: 2px solid #a6e3a1; border-radius: 12px; width: 600px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(166,227,161,0.2); position: relative; }
        .leaderboard-header { padding: 25px 20px; border-bottom: 1px solid #283325; text-align: center; font-size: 26px; font-weight: bold; color: #a6e3a1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(166,227,161,0.5); flex-shrink: 0; font-family: 'Neucha', cursive; }
        .leaderboard-list { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; }
        .lb-item { display: flex; align-items: center; justify-content: space-between; background: rgba(14, 17, 13, 0.8); border: 1px solid #283325; padding: 12px 20px; border-radius: 8px; transition: 0.3s; text-decoration: none; }
        .lb-item:hover { transform: scale(1.02); border-color: #a6e3a1; background: rgba(166,227,161,0.05); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .lb-rank { font-size: 24px; font-weight: bold; font-family: sans-serif; color: #6b7a62; width: 45px; text-align: center; }
        .lb-rank.top-1 { color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.8); font-size: 32px; }
        .lb-rank.top-2 { color: #c0c0c0; text-shadow: 0 0 15px rgba(192,192,192,0.8); font-size: 28px; }
        .lb-rank.top-3 { color: #cd7f32; text-shadow: 0 0 15px rgba(205,127,50,0.8); font-size: 26px; }
        .lb-user { display: flex; align-items: center; gap: 15px; flex: 1; margin-left: 15px; }
        .lb-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .lb-name { font-size: 22px; font-weight: bold; font-family: 'Neucha', cursive, sans-serif; }
        .lb-stats { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .lb-count { font-size: 26px; font-weight: bold; color: #fff; line-height: 1; font-family: 'Neucha', cursive, sans-serif; }
        .lb-count-label { font-size: 11px; color: #6b7a62; text-transform: uppercase; font-family: sans-serif; font-weight: bold; letter-spacing: 1px; margin-top: 4px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online { background: #a6e3a1; box-shadow: 0 0 8px #a6e3a1; }
        .status-offline { background: #555; }
    </style>
</head>

    <script>
        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = '../game/index.html'; 
        const ADMIN_USERNAME = 'skinwalker_nozxc'; 
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';

        let currentUser = null;
        let globalGames = []; 
        let currentSortDir = 'desc';
        let currentDisplayMode = 'tier'; 
        let visRoles = JSON.parse(localStorage.getItem('skinwalker_games_roles')) || { streamer: true, me: true, chat: true };
        
        function toggleVisualMenu() { document.getElementById('visual-dropdown').classList.toggle('show'); }

        function getTierData(score) {
            const num = Number(score) || 0;
            if (num === 0) return { letter: '—', color: '#6b7a62', glow: 'none' };
            if (num >= 9.0) return { letter: 'S', color: '#ff4a4a', glow: '0 0 15px rgba(255, 74, 74, 0.8)' };
            if (num >= 8.0) return { letter: 'A', color: '#ffd700', glow: '0 0 15px rgba(255, 215, 0, 0.8)' };
            if (num >= 7.0) return { letter: 'B', color: '#cba6f7', glow: '0 0 15px rgba(203, 166, 247, 0.8)' };
            if (num >= 5.0) return { letter: 'C', color: '#89b4fa', glow: '0 0 15px rgba(137, 180, 250, 0.8)' };
            if (num >= 3.0) return { letter: 'D', color: '#a6e3a1', glow: '0 0 15px rgba(166, 227, 161, 0.8)' };
            return { letter: 'F', color: '#888888', glow: '0 0 15px rgba(136, 136, 136, 0.8)' };
        } 
        
        window.globalUsersDB = {};

        const radarColors = [
            { bg: 'rgba(203, 166, 247, 0.2)', border: '#cba6f7' }, 
            { bg: 'rgba(184, 168, 123, 0.2)', border: '#b8a87b' }, 
            { bg: 'rgba(166, 227, 161, 0.2)', border: '#a6e3a1' }  
        ];
        
        if (typeof Chart !== 'undefined') { Chart.defaults.font.family = "'Neucha', cursive, sans-serif"; Chart.defaults.color = "#829c73"; }

        function getScoreColor(score, alpha = 1) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `rgba(107, 122, 98, ${alpha})`; 
            let r, g, b;
            if (numScore <= 5.5) {
                let p = (numScore - 1) / 4.5; if (p < 0) p = 0;
                r = Math.round(205 + p * (210 - 205)); g = Math.round(115 + p * (215 - 115)); b = Math.round(50 + p * (220 - 50));
            } else {
                let p = (numScore - 5.5) / 4.5; if (p > 1) p = 1;
                r = Math.round(210 + p * (255 - 210)); g = Math.round(215 + p * (235 - 215)); b = Math.round(220 + p * (20 - 220));
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getScoreShadow(score, isLarge) {
            const numScore = Number(score);
            const base = isLarge ? '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000' : '1px 1px 2px #000';
            if (numScore === 0 || isNaN(numScore)) return base;
            const color = getScoreColor(score, 1);
            const blur1 = Math.round(1 + (numScore / 10) * 5); 
            let glow = `${base}, 0 0 ${blur1}px ${color}`;
            if (numScore >= 8) glow += `, 0 0 ${Math.round(blur1 * 1.5)}px ${color}`;
            if (numScore === 10) glow += `, 0 0 15px rgba(255,255,255,0.3)`; 
            return glow;
        }

        function getGlassBoxStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: rgba(107,122,98,0.05); border: 1px solid rgba(107,122,98,0.2); box-shadow: none; backdrop-filter: blur(5px);`;
            const bg = getScoreColor(score, 0.15); const border = getScoreColor(score, 0.5); const glow = getScoreColor(score, 0.2);
            let blur = Math.round(4 + (numScore / 10) * 8);
            return `background: ${bg}; border: 1px solid ${border}; box-shadow: 0 4px 15px rgba(0,0,0,0.5), 0 0 ${blur}px ${glow} inset, 0 0 ${blur}px ${glow}; backdrop-filter: blur(5px);`;
        }

        function getGlassRowStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: transparent; border-left: 2px solid rgba(107,122,98,0.3);`;
            const bg = getScoreColor(score, 0.1); const border = getScoreColor(score, 0.8);
            return `background: linear-gradient(90deg, ${bg} 0%, transparent 100%); border-left: 2px solid ${border};`;
        }

        function toggleRoleSelect() {
            const sortVal = document.getElementById('sort-select').value;
            const needsRole = ['overall', 'avgTheory', 'visuals', 'gameplay', 'sound', 'tech', 'atmosphere'].includes(sortVal);
            const rs = document.getElementById('role-select');
            const rd = document.getElementById('role-divider');
            if(rs) rs.style.display = needsRole ? 'block' : 'none';
            if(rd) rd.style.display = needsRole ? 'block' : 'none';
        }

        function toggleSortDir() {
            currentSortDir = currentSortDir === 'desc' ? 'asc' : 'desc';
            document.getElementById('sort-dir-btn').innerText = currentSortDir === 'desc' ? '↓' : '↑';
            applyFiltersAndSort();
        }

        const safeNum = (v) => Number(v) || 0;
        const getAvg = (sum, count) => count > 0 ? parseFloat((sum/count).toFixed(1)) : 0;

        function loginTwitch() { window.SkinwalkerTwitch.login(); }
        function logoutTwitch() { window.SkinwalkerTwitch.logout(); }

        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB[lowerName]; 
            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            if (dbUser) {
                if (dbUser.role) r = dbUser.role.toUpperCase();
                if (dbUser.wallet_gold) g = dbUser.wallet_gold;
                if (dbUser.wallet_tickets) t = dbUser.wallet_tickets;
                if (dbUser.color && dbUser.color.trim() !== "") c = dbUser.color;
            }
            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (r === 'SUB' || r === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`;
            else if (r === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;
            return { role: r, gold: g, tickets: t, color: c, badge: badgeHtml };
        }

        async function checkTwitchAuth() {
            try {
                const hash = window.location.hash;
                let token = null;
                token = window.SkinwalkerTwitch.consumeRedirectToken();

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                    if (res.status === 401) { window.SkinwalkerTwitch.clearToken(); return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                        const colorData = await colorRes.json();
                        currentUser.color = (colorData.data && colorData.data[0] && colorData.data[0].color) ? colorData.data[0].color : null;
                    } catch(e) {}
                    
                    const uInfo = getUserInfo(currentUser.login, currentUser.color);
                    
                    document.getElementById('nav-auth').innerHTML = `
                        <div class="user-profile-neon" style="cursor: pointer;" onclick="window.location.href='profile.html?user=${currentUser.id}'" title="Мой профиль">
                            <div class="avatar-glow-wrap" style="--user-color: ${uInfo.color};">
                                <img src="${currentUser.profile_image_url}" class="user-avatar">
                            </div>
                            <div class="profile-info">
                                <div class="profile-top">
                                    <span class="profile-name-top" style="color: ${uInfo.color}; text-shadow: 0 0 8px ${uInfo.color};">${currentUser.display_name}</span>
                                    <button class="logout-neon" onclick="event.stopPropagation(); logoutTwitch();" title="Выйти из аккаунта">Выйти</button>
                                </div>
                                <div class="profile-bottom">
                                    ${uInfo.badge}
                                    <div class="wallet-item" style="color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);">
                                        <img src="../icons/BILET_GOLD.png" onerror="this.style.display='none'"> <span>${uInfo.gold}</span>
                                    </div>
                                    <div class="wallet-item" style="color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.3);">
                                        <img src="../icons/BILET.png" onerror="this.style.display='none'"> <span>${uInfo.tickets}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                    if (currentUser.login.toLowerCase() === ADMIN_USERNAME.toLowerCase()) {
                        document.body.classList.add('is-admin');
                    }
                    startOnlineHeartbeat();
                }
            } catch (e) { console.error('Ошибка авторизации', e); }
        }

        function startOnlineHeartbeat() {
            if (!currentUser) return;
            const updateOnline = () => {
                const dbId = currentUser.login.toLowerCase();
                fetch(`${FIREBASE_BASE}/global_users/${dbId}/last_online.json`, {
                    method: 'PUT', body: JSON.stringify(Date.now())
                }).catch(e => console.log('Heartbeat error', e));
            };
            updateOnline(); 
            setInterval(updateOnline, 60000); 
        }

        async function initApp() {
            try {
                const dbRes = await fetch(`${FIREBASE_BASE}/global_users.json`, { cache: 'no-store' });
                if (dbRes.ok) { window.globalUsersDB = (await dbRes.json()) || {}; }
            } catch(e) { console.warn("Не удалось загрузить базу пользователей", e); }

            await checkTwitchAuth();

            try {
                const [gamesRes, commRes] = await Promise.all([
                    fetch(`${FIREBASE_BASE}/games_db.json`, { cache: 'no-store' }),
                    fetch(`${FIREBASE_BASE}/games_community_db.json`, { cache: 'no-store' })
                ]);
                
                const data = await gamesRes.json();
                const commData = (await commRes.json()) || {};
                
                window.globalCommData = commData; 
                
                const room = document.getElementById('trophy-room');
                if (!data) { room.innerHTML = "<div class='loading'>База пуста.</div>"; return; }
                
                globalGames = []; 

                for (const [gameId, gameData] of Object.entries(data)) {
                    const info = gameData.info || {};
                    const sc = gameData.scores || {};
                    
                    let streamer = { overall:0, visuals:0, gameplay:0, sound:0, tech:0, atmosphere:0, countOv:0, countTh:0 };
                    
                    if (safeNum(sc.overall) > 0) { streamer.overall = safeNum(sc.overall); streamer.countOv = 1; }
                    if (sc.theory) {
                        streamer.visuals = safeNum(sc.theory.visuals);
                        streamer.gameplay = safeNum(sc.theory.gameplay);
                        streamer.sound = safeNum(sc.theory.sound);
                        streamer.tech = safeNum(sc.theory.tech);
                        streamer.atmosphere = safeNum(sc.theory.atmosphere);
                        if ((streamer.visuals + streamer.gameplay + streamer.sound + streamer.tech + streamer.atmosphere) > 0) streamer.countTh = 1;
                    }

                    let chat = { overall:0, visuals:0, gameplay:0, sound:0, tech:0, atmosphere:0, countOv:0, countTh:0 };
                    let me = { overall:0, visuals:0, gameplay:0, sound:0, tech:0, atmosphere:0, countOv:0, countTh:0 };

                    const gComm = commData[gameId] ? commData[gameId].ratings : null;
                    if (gComm) {
                        for (const [uid, r] of Object.entries(gComm)) {
                            const isMe = currentUser && uid === currentUser.id;
                            
                            if (safeNum(r.overall) > 0) {
                                chat.overall += safeNum(r.overall); chat.countOv++;
                                if (isMe) { me.overall += safeNum(r.overall); me.countOv++; }
                            }
                            
                            if (r.theory) {
                                const thSumChat = safeNum(r.theory.visuals) + safeNum(r.theory.gameplay) + safeNum(r.theory.sound) + safeNum(r.theory.tech) + safeNum(r.theory.atmosphere);
                                if (thSumChat > 0) {
                                    chat.visuals += safeNum(r.theory.visuals);
                                    chat.gameplay += safeNum(r.theory.gameplay);
                                    chat.sound += safeNum(r.theory.sound);
                                    chat.tech += safeNum(r.theory.tech);
                                    chat.atmosphere += safeNum(r.theory.atmosphere);
                                    chat.countTh++;
                                    
                                    if (isMe) {
                                        me.visuals += safeNum(r.theory.visuals);
                                        me.gameplay += safeNum(r.theory.gameplay);
                                        me.sound += safeNum(r.theory.sound);
                                        me.tech += safeNum(r.theory.tech);
                                        me.atmosphere += safeNum(r.theory.atmosphere);
                                        me.countTh++;
                                    }
                                }
                            }
                        }
                    }

                    const scoresObj = {
                        streamer: {
                            overall: getAvg(streamer.overall, streamer.countOv),
                            visuals: getAvg(streamer.visuals, streamer.countTh), gameplay: getAvg(streamer.gameplay, streamer.countTh),
                            sound: getAvg(streamer.sound, streamer.countTh), tech: getAvg(streamer.tech, streamer.countTh), atmosphere: getAvg(streamer.atmosphere, streamer.countTh)
                        },
                        chat: {
                            overall: getAvg(chat.overall, chat.countOv),
                            visuals: getAvg(chat.visuals, chat.countTh), gameplay: getAvg(chat.gameplay, chat.countTh),
                            sound: getAvg(chat.sound, chat.countTh), tech: getAvg(chat.tech, chat.countTh), atmosphere: getAvg(chat.atmosphere, chat.countTh)
                        },
                        me: {
                            overall: getAvg(me.overall, me.countOv),
                            visuals: getAvg(me.visuals, me.countTh), gameplay: getAvg(me.gameplay, me.countTh),
                            sound: getAvg(me.sound, me.countTh), tech: getAvg(me.tech, me.countTh), atmosphere: getAvg(me.atmosphere, me.countTh)
                        }
                    };

                    scoresObj.streamer.avgTheory = getAvg(scoresObj.streamer.visuals + scoresObj.streamer.gameplay + scoresObj.streamer.sound + scoresObj.streamer.tech + scoresObj.streamer.atmosphere, 5);
                    scoresObj.chat.avgTheory = getAvg(scoresObj.chat.visuals + scoresObj.chat.gameplay + scoresObj.chat.sound + scoresObj.chat.tech + scoresObj.chat.atmosphere, 5);
                    scoresObj.me.avgTheory = getAvg(scoresObj.me.visuals + scoresObj.me.gameplay + scoresObj.me.sound + scoresObj.me.tech + scoresObj.me.atmosphere, 5);

                    const hours = info.hours || info.episodesTotal || '?';
                    const status = info.status || 'Без статуса';

                    globalGames.push({
                        id: gameId, 
                        title: gameData.title || gameId.replace(/_/g, ' '), 
                        coverUrl: gameData.coverUrl || '',
                        hours: safeNum(hours), 
                        badgeText: `${status} • ${hours} ч.`,
                        release_year: parseInt(info.year) || 0, 
                        az: (gameData.title || gameId).toLowerCase(),
                        tier: sc.tier || 'UNRANKED', 
                        position: safeNum(sc.position) || 999,
                        scores: scoresObj
                    });
                }

                document.getElementById('controls-bar').style.display = 'flex';
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-layout').style.display = 'flex';
                
                initRoleVis();
                toggleRoleSelect();
                applyFiltersAndSort(); 

            } catch (e) { console.error(e); }

        function applyFiltersAndSort() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const sortVal = document.getElementById('sort-select').value;
            const roleVal = document.getElementById('role-select').value;
            const isDesc = currentSortDir === 'desc'; 
            
            if (sortVal === 'overall' || sortVal === 'az' || sortVal === 'release_year' || sortVal === 'hours') {
                currentDisplayMode = 'tier';
            } else {
                currentDisplayMode = 'score';
            }

            const needsRole = ['overall', 'avgTheory', 'visuals', 'gameplay', 'sound', 'tech', 'atmosphere'].includes(sortVal);

            let filtered = globalGames.filter(f => f.title.toLowerCase().includes(query));
            const tierWeight = { 'S': 6, 'A': 5, 'B': 4, 'C': 3, 'D': 2, 'F': 1, 'UNRANKED': 0, '—': 0 };

            filtered.sort((a, b) => {
                let valA, valB;
                
                if (sortVal === 'overall') {
                    if (roleVal === 'streamer') {
                        valA = tierWeight[a.tier] || 0;
                        valB = tierWeight[b.tier] || 0;
                        
                        if (valA === valB) {
                            return isDesc ? (a.position - b.position) : (b.position - a.position);
                        }
                        return isDesc ? (valB - valA) : (valA - valB);
                    } else {
                        valA = safeNum(a.scores[roleVal][sortVal]);
                        valB = safeNum(b.scores[roleVal][sortVal]);
                        return isDesc ? (valB - valA) : (valA - valB);
                    }
                }
                
                if (needsRole) {
                    valA = safeNum(a.scores[roleVal][sortVal]);
                    valB = safeNum(b.scores[roleVal][sortVal]);
                } else {
                    valA = a[sortVal]; 
                    valB = b[sortVal];
                }

                if (sortVal === 'az') {
                    return isDesc ? valA.localeCompare(valB) : valB.localeCompare(valA); 
                }

                return isDesc ? (valB - valA) : (valA - valB);
            });

            renderCards(filtered, sortVal);
        }

        window.currentRenderedCards = [];
        let hubRadarChart = null;

        function renderCards(arr, sortVal = 'overall') {
            window.currentRenderedCards = arr;
            const room = document.getElementById('trophy-room');
            room.innerHTML = "";
            
            if (arr.length === 0) { 
                room.innerHTML = "<div class='loading'>Ничего не найдено...</div>"; 
                return; 
            }

            const validKeys = ['overall', 'avgTheory', 'visuals', 'gameplay', 'sound', 'tech', 'atmosphere'];
            const scoreKey = validKeys.includes(sortVal) ? sortVal : 'overall';
            const sortNames = { 'avgTheory': 'СРЕДНЕМУ КРИТЕРИЮ', 'visuals': 'ВИЗУАЛУ', 'gameplay': 'ГЕЙМПЛЕЮ', 'sound': 'ЗВУКУ', 'tech': 'ТЕХНИКЕ', 'atmosphere': 'АТМОСФЕРЕ' };
            const labelHtml = scoreKey !== 'overall' ? `<div style="text-align: center; color: #829c73; font-size: 11px; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; text-shadow: 1px 1px 2px #000;">ОЦЕНКА ПО ${sortNames[scoreKey]}</div>` : '';

            arr.forEach((f, index) => {
                const safeIdForLink = encodeURIComponent(f.id).replace(/'/g, "%27");
                const safeDomId = f.id.replace(/[^a-zA-Z0-9_-]/g, "_");
                const detailsLink = `games-page.html?id=${safeIdForLink}`;
                const safeCoverUrl = f.coverUrl.replace(/'/g, "\\'");
                const s = f.scores;

                // Проверяем наличие видео в базе данных
                const gameOriginalData = window.globalCommData ? window.globalCommData[f.id] : null;
                // Ищем напрямую в сырой базе данных игр
                fetch(`${FIREBASE_BASE}/games_db/${encodeURIComponent(f.id)}.json`).then(res => res.json()).then(dbGame => {
                     if (dbGame && (dbGame.videoUrl || (dbGame.videoUrls && dbGame.videoUrls.length > 0))) {
                        // Ищем ВНУТРЕННЮЮ часть карточки, которая анимируется
                        const cardFace = document.querySelector(`#card-${safeDomId} .card-face`);
                        if (cardFace) {
                            // Создаем значок камеры (подстроенный под высоту статуса)
                            const badgeHtml = `
                                <div style="position: absolute; top: 8px; left: 8px; background: rgba(11, 13, 10, 0.6); backdrop-filter: blur(8px); border: 1px solid var(--card-border); border-radius: 6px; padding: 4px 8px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.8); z-index: 15; transition: 0.5s;">
                                    <svg viewBox="0 0 24 24" style="width: 16px; height: 16px; fill: none; stroke: var(--theme-light, #c4d1b8); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;"><path d="M15 10l4.553 -2.276a1 1 0 0 1 1.447 .894v6.764a1 1 0 0 1 -1.447 .894l-4.553 -2.276v-4z" /><rect x="3" y="6" width="12" height="12" rx="2" /></svg>
                                </div>
                            `;
                            cardFace.insertAdjacentHTML('beforeend', badgeHtml);
                            
                            // Находим плашку статуса и сдвигаем её в правый угол
                            const statusBadge = cardFace.querySelector('.ep-badge');
                            if (statusBadge) {
                                statusBadge.style.left = 'auto';
                                statusBadge.style.right = '8px';
                                statusBadge.style.transform = 'none';
                            }
                        }
                    }
                });


                const valStr = s.streamer[scoreKey] || 0;
                const valChat = s.chat[scoreKey] || 0;
                const valMe = s.me[scoreKey] || 0;

                const getBoxHtml = (roleClass, labelText, val) => {
                    if (currentDisplayMode === 'tier') {
                        let tier;
                        if (roleClass === 'streamer' && f.tier && f.tier !== 'UNRANKED') {
                            const tierColorsMap = { 'S': '#ff4a4a', 'A': '#ffd700', 'B': '#cba6f7', 'C': '#89b4fa', 'D': '#a6e3a1', 'F': '#888888' };
                            const tColor = tierColorsMap[f.tier] || '#6b7a62';
                            tier = { letter: f.tier, color: tColor, glow: `0 0 15px ${tColor}80` };
                        } else {
                            tier = getTierData(val);
                        }

                        return `
                            <div class="score-box" style="background: ${tier.color}15; border: 1px solid ${tier.color}60; box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 15px ${tier.color}15;">
                                <div class="score-label ${roleClass}" style="color:${tier.color}; border-bottom-color:${tier.color}60; text-shadow:0 0 8px ${tier.color};">${labelText}</div>
                                <div class="main-score" style="color:${tier.color}; text-shadow:${tier.glow}; font-size: 34px;">${tier.letter}</div>
                            </div>
                        `;
                    } else {
                        return `
                            <div class="score-box" style="${getGlassBoxStyle(val)}">
                                <div class="score-label ${roleClass}" style="color:${getScoreColor(val, 1)}; border-bottom-color:${getScoreColor(val, 0.4)}; text-shadow:0 0 8px ${getScoreColor(val, 0.6)};">${labelText}</div>
                                <div class="main-score" style="color:#fff; text-shadow:${getScoreShadow(val, true)};">${val}<span> / 10</span></div>
                            </div>
                        `;
                    }
                };

                const strBoxHtml = visRoles.streamer ? getBoxHtml('streamer', 'Стример', valStr) : '';
                const chatBoxHtml = visRoles.chat ? getBoxHtml('chat', 'Чат', valChat) : '';
                const meBoxHtml = visRoles.me ? getBoxHtml('me', 'РЇ', valMe) : '';

                const cardHtml = `
                <div class="card-container" id="card-${safeDomId}" data-cover="${safeCoverUrl}" onmouseenter="openHubPreview(${index})" onmouseleave="closeHubPreview()" onclick="window.location.href='${detailsLink}'" style="--card-color: #283325; --card-border: rgba(40, 51, 37, 0.8); --card-shadow: rgba(0,0,0,0.5); --card-shadow-hover: rgba(166, 227, 161, 0.25);">
                    <div class="card-face" style="background-image: url('${safeCoverUrl}');">
                        <div class="ep-badge">${f.badgeText}</div>
                        <div class="front-overlay">
                            ${labelHtml}
                            <div class="scores-row">
                                ${strBoxHtml}
                                ${meBoxHtml}
                                ${chatBoxHtml}
                            </div>
                            <div class="divider"></div>
                            <div class="game-title">${f.title}</div>
                        </div>
                    </div>
                </div>
                `;
                room.insertAdjacentHTML('beforeend', cardHtml);
            });
            
            extractHubColors();
        }

        function extractHubColors() {
            if (typeof ColorThief === 'undefined') return;
            const colorThief = new ColorThief();
            document.querySelectorAll('.card-container').forEach(card => {
                const imgUrl = card.getAttribute('data-cover');
                if (!imgUrl) return;

                const processColor = (imgEl) => {
                    try {
                        const color = colorThief.getColor(imgEl);
                        let r = color[0], g = color[1], b = color[2];
                        const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                        let tr = r, tg = g, tb = b;
                        if (luminance < 90) { tr = Math.min(255, r + 80); tg = Math.min(255, g + 80); tb = Math.min(255, b + 80); }

                        card.style.setProperty('--card-color', `rgb(${r}, ${g}, ${b})`);
                        card.style.setProperty('--card-border', `rgba(${r}, ${g}, ${b}, 0.6)`);
                        card.style.setProperty('--card-shadow', `rgba(${r}, ${g}, ${b}, 0.2)`);
                        card.style.setProperty('--card-shadow-hover', `rgba(${r}, ${g}, ${b}, 0.8)`);
                        card.style.setProperty('--theme-light', `rgb(${tr}, ${tg}, ${tb})`); 
                        card.dataset.rgb = `${tr}, ${tg}, ${tb}`;
                    } catch(e) {}
                };

                const hiddenImg = new Image();
                hiddenImg.crossOrigin = 'Anonymous';
                hiddenImg.onload = () => processColor(hiddenImg);
                
                hiddenImg.onerror = function() {
                    const proxyImg = new Image(); 
                    proxyImg.crossOrigin = 'Anonymous';
                    proxyImg.onload = () => processColor(proxyImg);
                    proxyImg.onerror = function() {
                        const proxyImg2 = new Image(); 
                        proxyImg2.crossOrigin = 'Anonymous';
                        proxyImg2.onload = () => processColor(proxyImg2);
                        proxyImg2.src = 'https://wsrv.nl/?url=' + encodeURIComponent(imgUrl);
                    };
                    proxyImg.src = 'https://corsproxy.io/?' + encodeURIComponent(imgUrl);
                };
                
                hiddenImg.src = imgUrl + '?bypassCache=' + Date.now();
            });
        }

        function openHubPreview(index) {
            window.lastHoveredIndex = index;
            const f = window.currentRenderedCards[index];
            if (!f) return;

            const safeDomId = f.id.replace(/[^a-zA-Z0-9_-]/g, "_");
            const cardElem = document.getElementById(`card-${safeDomId}`);
            const s = f.scores;

            const themeLight = cardElem.style.getPropertyValue('--theme-light').trim() || '#a6e3a1';
            const cardShadow = cardElem.style.getPropertyValue('--card-shadow-hover').trim() || 'rgba(166, 227, 161, 0.3)';

            document.getElementById('hub-preview-placeholder').style.display = 'none';
            document.getElementById('hub-preview-container').style.display = 'flex';
            
            const bg = document.getElementById('dynamic-bg');
            bg.style.backgroundImage = `url('${f.coverUrl}')`;
            bg.classList.add('active');

            if (cardElem.dataset.rgb) {
                const rgb = cardElem.dataset.rgb;
                document.documentElement.style.setProperty('--theme-primary', `rgb(${rgb})`);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${rgb}, 0.5)`);
                document.documentElement.style.setProperty('--theme-panel-border', `rgba(${rgb}, 0.4)`);
            }
            
            const panel = document.getElementById('hub-right-panel');
            panel.style.borderColor = themeLight;
            panel.style.boxShadow = `0 10px 30px rgba(0,0,0,0.8), 0 0 20px ${cardShadow}`;

            document.getElementById('hub-preview-cover').src = f.coverUrl;
            document.getElementById('hub-preview-cover').style.borderColor = themeLight;
            document.getElementById('hub-preview-title').innerText = f.title;
            document.getElementById('hub-preview-title').style.color = themeLight;
            document.getElementById('hub-preview-btn').style.borderColor = themeLight;
            document.getElementById('hub-preview-btn').onclick = () => window.location.href = `games-page.html?id=${encodeURIComponent(f.id).replace(/'/g, "%27")}`;

            const createStatCol = (title, chartColor, avgTheory, theory) => {
                const numAvg = Number(avgTheory) || 0;
                const titleColor = numAvg > 0 ? getScoreColor(numAvg, 1) : '#6b7a62';
                const titleShadow = numAvg > 0 ? getScoreShadow(numAvg, false) : 'none';
                
                const row = (name, val) => {
                    const numVal = Number(val) || 0;
                    const textColor = numVal > 0 ? getScoreColor(numVal, 1) : '#6b7a62';
                    const textShadow = numVal > 0 ? getScoreShadow(numVal, false) : 'none';
                    const numColor = numVal > 0 ? '#fff' : '#555';
                    return `
                    <div style="${getGlassRowStyle(numVal)} display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border-radius: 0 6px 6px 0; margin-bottom: 4px;">
                        <span style="color: ${textColor}; font-family: 'Neucha', cursive; font-size: 15px; font-weight: bold; text-shadow: ${textShadow};">${name}</span>
                        <span style="color: ${numColor}; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; text-shadow: ${textShadow};">${val || '-'}</span>
                    </div>`;
                };

                return `
                <div style="${getGlassBoxStyle(numAvg)} flex: 1; display: flex; flex-direction: column; align-items: center; padding: 12px 6px; border-radius: 8px;">
                    <div style="color: ${titleColor}; text-shadow: ${titleShadow}; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: bold; text-transform: uppercase; margin-bottom: 6px;">
                        <div style="width: 10px; height: 10px; border-radius: 50%; background: ${chartColor}; box-shadow: 0 0 5px ${chartColor};"></div>
                        ${title}
                    </div>
                    <div style="color: #fff; font-size: 26px; font-weight: bold; text-shadow: ${numAvg > 0 ? getScoreShadow(numAvg, true) : 'none'}; margin-bottom: 5px; font-family: 'Neucha', cursive;">${numAvg > 0 ? numAvg : '-'}</div>
                    <div style="width: 100%; display: flex; flex-direction: column; gap: 4px; border-top: 1px dashed rgba(74, 92, 65, 0.6); padding-top: 8px; margin-top: 5px;">
                        ${row('Визуал', theory.visuals)}
                        ${row('Геймплей', theory.gameplay)}
                        ${row('Р—РІСѓРє', theory.sound)}
                        ${row('Техника', theory.tech)}
                        ${row('Атмосфера', theory.atmosphere)}
                    </div>
                </div>
                `;
            };

            document.getElementById('hub-preview-theory').innerHTML = `
                <div style="display: flex; justify-content: space-between; gap: 10px; width: 100%;">
                    ${visRoles.streamer ? createStatCol('Стример', radarColors[0].border, s.streamer.avgTheory, s.streamer) : ''}
                    ${visRoles.me ? createStatCol('РЇ', radarColors[2].border, s.me.avgTheory, s.me) : ''}
                    ${visRoles.chat ? createStatCol('Чат', radarColors[1].border, s.chat.avgTheory, s.chat) : ''}
                </div>
            `;

            const ctx = document.getElementById('hub-previewChart').getContext('2d');
            const datasets = [
                { data: [s.streamer.visuals, s.streamer.gameplay, s.streamer.sound, s.streamer.tech, s.streamer.atmosphere], backgroundColor: radarColors[0].bg, borderColor: radarColors[0].border, pointBackgroundColor: radarColors[0].border, borderWidth: 2, pointRadius: 2, hidden: !visRoles.streamer },
                { data: [s.chat.visuals, s.chat.gameplay, s.chat.sound, s.chat.tech, s.chat.atmosphere], backgroundColor: radarColors[1].bg, borderColor: radarColors[1].border, pointBackgroundColor: radarColors[1].border, borderWidth: 2, pointRadius: 2, hidden: !visRoles.chat },
                { data: [s.me.visuals, s.me.gameplay, s.me.sound, s.me.tech, s.me.atmosphere], backgroundColor: radarColors[2].bg, borderColor: radarColors[2].border, pointBackgroundColor: radarColors[2].border, borderWidth: 2, pointRadius: 2, hidden: !visRoles.me }
            ];

            if (hubRadarChart) {
                hubRadarChart.data.datasets = datasets;
                hubRadarChart.update();
            } else {
                hubRadarChart = new Chart(ctx, {
                    type: 'radar',
                    data: { labels: ['Визуал', 'Геймплей', 'Звук', 'Техника', 'Атмосфера'], datasets: datasets },
                    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: 'rgba(255,255,255,0.1)' }, angleLines: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { font: { size: 11, weight: 'bold' }, color: '#c4d1b8' } } } }
                });
            }
        }

        function closeHubPreview() {
            document.getElementById('dynamic-bg').classList.remove('active');
            document.documentElement.style.removeProperty('--theme-primary');
            document.documentElement.style.removeProperty('--theme-glow');
            document.documentElement.style.removeProperty('--theme-panel-border');
        }
         
        initApp();
        window.SkinwalkerFirebaseStream.subscribe('games-data', `${FIREBASE_BASE}/games_db.json`, initApp);
        window.SkinwalkerFirebaseStream.subscribe('games-community', `${FIREBASE_BASE}/games_community_db.json`, initApp);

        // --- ЛОГИКА ЗАЛА СЛАВЫ (ТОЛЬКО ИГРЫ - ЗАЩИЩЕННАЯ ВЕРСИЯ) ---
        let lbAllUsers = [];

        window.openLeaderboard = async function() {
            try {
                if (!window.globalCommData) {
                    const btn = document.querySelector('button[onclick="window.openLeaderboard()"]');
                    const oldText = btn ? btn.innerText : 'Зрители';
                    if (btn) btn.innerText = "Загрузка...";
                    
                    const gamesCommRes = await fetch(`${FIREBASE_BASE}/games_community_db.json`);
                    window.globalCommData = await gamesCommRes.json() || {};
                    
                    if (btn) btn.innerText = oldText;
                }

                const userStats = {};
                
                if (window.globalCommData && typeof window.globalCommData === 'object') {
                    for (const [gameId, gameData] of Object.entries(window.globalCommData)) {
                        if (gameData && gameData.ratings && typeof gameData.ratings === 'object') { 
                            for (const [userId, rating] of Object.entries(gameData.ratings)) {
                                if (!rating) continue; 

                                if ((Number(rating.overall) > 0) || (rating.theory && Object.values(rating.theory).some(v => Number(v) > 0))) {
                                    if (!userStats[userId]) {
                                        userStats[userId] = { 
                                            id: userId, 
                                            name: rating.displayName || userId, 
                                            avatar: rating.profileImage || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png', 
                                            count: 0 
                                        };
                                    }
                                    userStats[userId].count++;
                                    if (rating.displayName) userStats[userId].name = rating.displayName;
                                    if (rating.profileImage) userStats[userId].avatar = rating.profileImage;
                                }
                            }
                        }
                    }
                }
                
                lbAllUsers = Object.values(userStats).sort((a, b) => b.count - a.count);
                
                const searchInput = document.getElementById('lb-search');
                if (searchInput) searchInput.value = '';
                
                window.renderLeaderboard(lbAllUsers);
                
                const modal = document.getElementById('leaderboard-modal');
                if (modal) modal.style.display = 'flex';
                
            } catch(e) {
                console.error("Ошибка при сборке Зала Славы:", e);
                alert("Ошибка сборки зрителей: " + e.message);
            }
        };

        window.renderLeaderboard = function(usersArray) {
            const listEl = document.getElementById('leaderboard-list');
            if (!listEl) return;
            
            listEl.innerHTML = '';
            if (usersArray.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: #6b7a62; padding: 30px; font-size: 18px;">Никого не найдено.</div>'; 
                return;
            }
            
            usersArray.forEach((u) => {
                const originalIndex = lbAllUsers.findIndex(orig => orig.id === u.id);
                const rank = originalIndex + 1;
                
                let rankClass = ''; let crown = rank;
                if (rank === 1) { rankClass = 'top-1'; crown = 'рџ'''; }
                else if (rank === 2) { rankClass = 'top-2'; crown = '🥈'; }
                else if (rank === 3) { rankClass = 'top-3'; crown = '🥉'; }

                const safeName = (u.name || '').toString().toLowerCase();
                const dbUser = window.globalUsersDB ? window.globalUsersDB[safeName] : null;
                
                const color = (dbUser && dbUser.color) ? dbUser.color : '#a4b09c';
                const isOnline = dbUser && dbUser.last_online && (Date.now() - dbUser.last_online < 150000);
                const statusDot = isOnline 
                    ? '<div class="status-dot status-online" style="display:inline-block; margin-right:6px;"></div><span style="color:#a6e3a1; font-size:13px; font-family:sans-serif;">В сети</span>' 
                    : '<div class="status-dot status-offline" style="display:inline-block; margin-right:6px;"></div><span style="color:#6b7a62; font-size:13px; font-family:sans-serif;">Не в сети</span>';

                const html = `
                <a href="profile.html?user=${u.id}" class="lb-item">
                    <div class="lb-rank ${rankClass}">${crown}</div>
                    <div class="lb-user">
                        <img src="${u.avatar}" class="lb-avatar" style="border-color: ${color};">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <div class="lb-name" style="color: ${color}; text-shadow: 0 0 8px ${color}80; line-height: 1;">${u.name}</div>
                            <div style="display: flex; align-items: center;">${statusDot}</div>
                        </div>
                    </div>
                    <div class="lb-stats">
                        <div class="lb-count">${u.count}</div>
                        <div class="lb-count-label">оценок</div>
                    </div>
                </a>`;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        };

        window.filterLeaderboard = function() {
            const searchInput = document.getElementById('lb-search');
            if (!searchInput) return;
            const query = searchInput.value.toLowerCase().trim();
            if (!query) { window.renderLeaderboard(lbAllUsers); return; }
            const filtered = lbAllUsers.filter(u => (u.name || '').toString().toLowerCase().includes(query));
            window.renderLeaderboard(filtered);
        };
    </script>
</body>
