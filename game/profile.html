<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль Пользователя - Аниме</title>
    <link href="https://fonts.googleapis.com/css2?family=Neucha&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../shared/site-header.css">
    <script src="../shared/site-header.js" defer></script>
    <script src="../shared/twitch-auth.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.0/color-thief.umd.js"></script>

    <style>
        :root {
            --theme-primary: #a6e3a1; 
            --theme-glow: rgba(166, 227, 161, 0.2); 
            --theme-panel-bg-top: #101411;
            --theme-panel-bg-bottom: #080a08;
            --theme-panel-header: #0b0d0a;
            --theme-panel-border: #283325;
            --btn-color: #a6e3a1;
        }

        body { 
            margin: 0; padding: 0 0 40px 0; font-family: 'Neucha', cursive, sans-serif; 
            background-color: #0b0d0a; color: #a4b09c; min-width: 1200px; 
            min-height: 100vh; overflow-x: hidden; display: flex; flex-direction: column;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
        }

        #dynamic-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; filter: blur(40px) brightness(0.2); opacity: 0; z-index: -1; pointer-events: none; transition: opacity 0.5s ease, background-image 0.5s ease; }
        #dynamic-bg.active { opacity: 1; }

        .top-nav, .nav-logo, .widget-base, .widget-header, .preview-title, #dynamic-right-panel, .tab-btn {
            transition: color 0.5s ease, text-shadow 0.5s ease, border-color 0.5s ease, box-shadow 0.5s ease !important;
        }

        /* РЁРђРџРљРђ */
        .top-nav { background: #0b0d0a; border-bottom: 2px solid var(--theme-panel-border); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 20px rgba(0,0,0,0.5); width: 100%; box-sizing: border-box; flex-shrink: 0; z-index: 1000; position: relative; }
        .nav-logo { color: var(--theme-primary); font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-decoration: none; transition: 0.5s; cursor: pointer; text-shadow: 0 0 10px var(--theme-glow); }
        .nav-logo:hover { filter: brightness(1.2); }
        .nav-btn { background: transparent; border: none; color: #a4b09c; padding: 5px 0; font-family: inherit; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; position: relative; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; outline: none; }
        .nav-btn::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -6px; left: 50%; background-color: var(--btn-color); transition: 0.3s; transform: translateX(-50%); box-shadow: 0 0 8px var(--btn-color); }
        .nav-btn:hover { color: var(--btn-color); text-shadow: 0 0 10px var(--btn-color); }
        .nav-btn:hover::after, .nav-btn.active::after { width: 100%; }

        .btn-hub:hover { --btn-color: #ffd700; color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .btn-tier:hover { --btn-color: #ff4a4a; color: #ff4a4a; text-shadow: 0 0 10px rgba(255, 74, 74, 0.5); }
        .btn-visual:hover { --btn-color: #a6e3a1; color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.5); }

        /* ЛОГОТИП ВЫПАДАЮЩЕЕ МЕНЮ */
        .logo-dropdown { position: relative; display: inline-block; padding: 10px 0; }
        .nav-logo-wrap { display: flex; align-items: center; gap: 8px; color: var(--theme-primary); font-size: 24px; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--theme-glow); cursor: pointer; transition: 0.3s; font-family: 'Neucha', cursive; }
        .nav-logo-wrap:hover { filter: brightness(1.2); }
        .logo-arrow { font-size: 14px; opacity: 0.7; transition: transform 0.3s; }
        .logo-dropdown:hover .logo-arrow { transform: rotate(180deg); }
        .logo-dropdown-content { display: none; position: absolute; left: 0; top: 100%; margin-top: -5px; background: rgba(14, 17, 13, 0.95); border: 1px solid var(--theme-panel-border); border-radius: 12px; padding: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 200px; backdrop-filter: blur(10px); flex-direction: column; gap: 5px; }
        .logo-dropdown:hover .logo-dropdown-content { display: flex; }
        .logo-link { color: #a4b09c; text-decoration: none; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; text-transform: uppercase; padding: 10px 15px; border-radius: 8px; transition: 0.3s; text-align: left; display: flex; align-items: center; gap: 10px; border: 1px solid transparent; }
        .logo-link:hover { background: rgba(0,0,0,0.4); color: var(--site-color); text-shadow: 0 0 10px var(--site-color); border-color: var(--site-color); }
        .logo-link.active { color: var(--site-color); background: rgba(0,0,0,0.3); border-left: 3px solid var(--site-color); border-radius: 4px 8px 8px 4px; }

        /* ВИЗУАЛ МЕНЮ */
        .visual-dropdown { position: relative; display: inline-block; }
        .visual-dropdown-content { display: none; position: absolute; left: 50%; transform: translateX(-50%); top: 100%; margin-top: 15px; background: rgba(14, 17, 13, 0.95); border: 1px solid var(--theme-panel-border); border-radius: 12px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); z-index: 2000; min-width: 250px; backdrop-filter: blur(10px); flex-direction: column; gap: 15px; }
        .visual-dropdown.show .visual-dropdown-content { display: flex; }
        .role-toggles { display: flex; gap: 20px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 0; }
        .role-toggle-btn { background: transparent; border: none; border-bottom: 2px solid rgba(107, 122, 98, 0.3); color: #6b7a62; padding: 4px 2px; font-family: inherit; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; text-transform: uppercase; outline: none; }
        .role-toggle-btn:hover { color: #c4d1b8; border-bottom-color: rgba(196, 209, 184, 0.5); }
        .role-toggle-btn.active.streamer { color: #cba6f7; border-bottom-color: #cba6f7; text-shadow: 0 0 8px rgba(203, 166, 247, 0.6); }
        .role-toggle-btn.active.me { color: #a6e3a1; border-bottom-color: #a6e3a1; text-shadow: 0 0 8px rgba(166, 227, 161, 0.6); }
        .role-toggle-btn.active.chat { color: #b8a87b; border-bottom-color: #b8a87b; text-shadow: 0 0 8px rgba(184, 168, 123, 0.6); }

        /* ПРОФИЛЬ ТВИЧА */
        .nav-auth .twitch-btn { background: #6441a5; color: white; padding: 8px 16px; border-radius: 8px; font-family: 'Neucha', cursive; font-size: 18px; font-weight: bold; cursor: pointer; border: 1px solid #4a307a; transition: 0.2s; letter-spacing: 1px;}
        .nav-auth .twitch-btn:hover { background: #7d5bbe; box-shadow: 0 0 15px rgba(100, 65, 165, 0.8); }
        .user-profile-neon { display: flex; align-items: center; gap: 18px; background: rgba(15, 20, 15, 0.2); backdrop-filter: blur(16px); padding: 10px 25px 10px 10px; border-radius: 12px; border: 1px solid var(--theme-panel-border); box-shadow: 0 8px 32px rgba(0,0,0,0.5); transition: 0.5s; }
        .user-profile-neon:hover { background: rgba(15, 20, 15, 0.3); border-color: rgba(166, 227, 161, 0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 15px rgba(166, 227, 161, 0.1); }
        .avatar-glow-wrap { position: relative; display: flex; justify-content: center; align-items: center; }
        .avatar-glow-wrap::before { content: ''; position: absolute; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color, #a6e3a1); filter: blur(10px); opacity: 0.3; transition: 0.3s; }
        .user-profile-neon:hover .avatar-glow-wrap::before { opacity: 0.6; }
        .user-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--user-color, #a6e3a1); position: relative; z-index: 2; object-fit: cover; }
        .profile-info { display: flex; flex-direction: column; justify-content: center; gap: 6px; }
        .profile-top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .profile-name-top { font-family: 'Neucha', cursive; font-size: 16px; font-weight: bold; letter-spacing: 1px; line-height: 1; }
        .profile-bottom { display: flex; align-items: center; gap: 15px; }
        .role-badge { display: inline-flex; align-items: center; justify-content: center; padding: 2px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .role-sub { background: #6441a5; color: #fff !important; border: 1px solid #4a307a; text-shadow: 1px 1px 2px #000; } 
        .role-vip { background: #e05e85; color: #fff !important; border: 1px solid #b83d63; text-shadow: 1px 1px 2px #000; } 
        .role-f { background: #333333; color: #a4b09c !important; border: 1px solid #222; }
        .wallet-item { display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; line-height: 1; text-shadow: 1px 1px 2px #000; }
        .wallet-item img { width: 18px; height: 18px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8)); }
        .logout-neon { background: transparent; border: none; color: rgba(255, 85, 85, 0.6); font-family: inherit; font-size: 15px; text-transform: uppercase; font-weight: bold; cursor: pointer; transition: 0.3s; padding: 0; line-height: 1;}
        .logout-neon:hover { color: #ff5555; text-shadow: 0 0 12px rgba(255, 85, 85, 0.8); transform: scale(1.05); }

        /* ОСНОВНОЙ ЛЕЙАУТ */
        .layout { display: flex; gap: 30px; align-items: flex-start; padding: 25px 40px; width: 100%; box-sizing: border-box; max-width: 100%; margin: 0 auto; flex: 1; }
        .col-left { width: 420px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; }
        .col-right { width: 420px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; position: sticky; top: 20px; }
        .col-center { flex: 1; display: flex; flex-direction: column; gap: 20px; min-width: 0; }
        .widget-content { padding: 20px; flex: 1; }

        .widget-base { background: rgba(14, 17, 13, 0.4); backdrop-filter: blur(15px); border: 1px solid var(--theme-panel-border); border-radius: 12px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; }
        .widget-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: rgba(14, 17, 13, 0.8); border-bottom: 1px solid var(--theme-panel-border); flex-shrink: 0; }

        .tabs-container { display: flex; gap: 20px; }
        .tab-btn { background: transparent; border: none; color: #6b7a62; font-family: inherit; font-size: 20px; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: 0.3s; padding: 5px 10px; position: relative; outline: none; }
        .tab-btn:hover { color: #c4d1b8; }
        .tab-btn.active { color: var(--theme-primary); text-shadow: 0 0 10px var(--theme-glow); transition: 0.5s; }
        .tab-btn.active::after { content: ''; position: absolute; width: 100%; height: 3px; bottom: -8px; left: 0; background-color: var(--theme-primary); box-shadow: 0 0 10px var(--theme-glow); transition: 0.5s; }
        .tab-content { display: none; flex-direction: column; gap: 20px; flex: 1; }
        .tab-content.active { display: flex; }

        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        .stat-box { background: rgba(0,0,0,0.3); border: 1px solid var(--theme-panel-border); padding: 15px 10px; border-radius: 8px; display: flex; flex-direction: column; align-items: center; transition: 0.5s; }
        .stat-val { font-size: 32px; font-weight: bold; color: #fff; line-height: 1; margin-bottom: 5px; text-shadow: 2px 2px 4px #000; font-family: inherit; }
        .stat-label { font-size: 13px; text-transform: uppercase; color: #829c73; font-weight: bold; letter-spacing: 1px; text-align: center; }
        .chart-wrapper { width: 100%; height: 260px; margin-top: 10px; }

        .profile-card { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 10px 0; }
        .avatar-wrap { position: relative; width: 120px; height: 120px; margin-bottom: 15px; }
        .avatar-wrap::before { content: ''; position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; border-radius: 50%; background: var(--user-color); filter: blur(20px); opacity: 0.3; }
        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; border: 3px solid var(--user-color); position: relative; z-index: 2; object-fit: cover; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .profile-name { font-size: 32px; font-weight: bold; letter-spacing: 1px; margin-bottom: 10px; line-height: 1; }
        .badges-row { display: flex; gap: 10px; justify-content: center; align-items: center; margin-bottom: 15px; }

        .hof-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card-container { width: 100%; aspect-ratio: 2 / 3; position: relative; justify-self: center; }
        .card-container::before { content: ''; position: absolute; top: -10%; left: -10%; width: 120%; height: 120%; background: var(--card-color); filter: blur(30px); opacity: 0.15; z-index: -1; transition: 0.5s; border-radius: 50%; }
        .card-container:hover::before { opacity: 0.35; transform: scale(1.05); }
        .card-face { position: absolute; width: 100%; height: 100%; border-radius: 10px; overflow: hidden; background-size: cover; background-position: center; display: flex; flex-direction: column; transition: 0.3s; border: 2px solid var(--card-border); cursor: pointer; box-shadow: 0 0 15px var(--card-shadow); }
        .card-container:hover .card-face { border-color: var(--card-color); transform: translateY(-8px); box-shadow: 0 10px 30px var(--card-shadow-hover); }
        .front-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 10px 10px 10px; box-sizing: border-box; background: linear-gradient(0deg, rgba(11,13,10,1) 0%, rgba(11,13,10,0.9) 50%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; pointer-events: none; }
        .anime-title { color: var(--theme-light, #fff); font-size: 13px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; text-align: center; text-shadow: 2px 2px 4px #000; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.2; transition: 0.5s; }
        
        .score-box-mini { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,0.8); border: 1px solid; padding: 4px 8px; border-radius: 6px; display: flex; align-items: center; gap: 4px; z-index: 10; backdrop-filter: blur(5px); }
        .tier-score-mini { font-size: 22px; font-weight: bold; line-height: 1; font-family: inherit; margin-top: 1px; }

        .preview-cover { width: 100%; height: 200px; object-fit: cover; -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%); border-bottom: 2px solid var(--user-color); }
        .preview-content { padding: 0 20px 20px 20px; margin-top: -60px; position: relative; z-index: 2; display: flex; flex-direction: column; gap: 12px; }
        .preview-title { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 2px 2px 5px #000, 0 0 10px var(--user-color); text-transform: uppercase; line-height: 1.1; text-align: center; transition: color 0.5s; }
        .preview-score-box { background: rgba(0,0,0,0.5); border: 1px solid var(--user-color); border-radius: 8px; padding: 8px; text-align: center; box-shadow: 0 0 10px rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
        .preview-score-label { font-size: 12px; color: #a4b09c; text-transform: uppercase; font-weight: bold; letter-spacing: 1px; }
        .preview-score-val { font-size: 55px; font-weight: bold; color: #fff; line-height: 1; text-shadow: 2px 2px 4px #000; font-family: inherit !important; }
        .preview-avg-theory { font-size: 18px; color: #c4d1b8; font-weight: bold; text-align: center; margin: 5px 0 10px 0; padding-bottom: 5px; text-shadow: 1px 1px 2px #000; text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); font-family: inherit !important; }
        .preview-chart-wrap { width: 100%; height: 180px; margin-top: 0; }
        .preview-crit-row { display: flex; justify-content: space-between; padding: 4px 10px; border-bottom: 1px dashed rgba(255,255,255,0.15); font-size: 15px; color: #c4d1b8; transition: 0.3s; }
        .preview-crit-row span:last-child { font-weight: bold; color: #fff; font-size: 18px; font-family: inherit !important; }
        .preview-comment { background: rgba(0,0,0,0.4); border-left: 3px solid var(--user-color); padding: 12px; border-radius: 0 8px 8px 0; color: #c4d1b8; font-size: 14px; line-height: 1.4; font-style: italic; white-space: pre-wrap; word-break: break-word; }
        .preview-placeholder { padding: 40px 20px; text-align: center; color: #6b7a62; font-size: 18px; display: flex; height: 100%; align-items: center; justify-content: center; }
        
        .loading-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0b0d0a; z-index: 9999; display: flex; justify-content: center; align-items: center; color: #a6e3a1; font-size: 24px; flex-direction: column; }

        /* ЗАЛ СЛАВЫ */
        .leaderboard-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 3000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .leaderboard-box { background: #0b0d0a; border: 2px solid #a6e3a1; border-radius: 12px; width: 600px; max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 0 30px rgba(166,227,161,0.2); position: relative; }
        .leaderboard-header { padding: 25px 20px; border-bottom: 1px solid #283325; text-align: center; font-size: 26px; font-weight: bold; color: #a6e3a1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 15px rgba(166,227,161,0.5); flex-shrink: 0; font-family: inherit; }
        .leaderboard-list { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; scrollbar-width: thin; }
        .lb-item { display: flex; align-items: center; justify-content: space-between; background: rgba(14, 17, 13, 0.8); border: 1px solid #283325; padding: 12px 20px; border-radius: 8px; transition: 0.3s; text-decoration: none; }
        .lb-item:hover { transform: scale(1.02); border-color: #a6e3a1; background: rgba(166,227,161,0.05); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .lb-rank { font-size: 24px; font-weight: bold; font-family: sans-serif; color: #6b7a62; width: 45px; text-align: center; }
        .lb-rank.top-1 { color: #ffd700; text-shadow: 0 0 15px rgba(255,215,0,0.8); font-size: 32px; }
        .lb-rank.top-2 { color: #c0c0c0; text-shadow: 0 0 15px rgba(192,192,192,0.8); font-size: 28px; }
        .lb-rank.top-3 { color: #cd7f32; text-shadow: 0 0 15px rgba(205,127,50,0.8); font-size: 26px; }
        .lb-user { display: flex; align-items: center; gap: 15px; flex: 1; margin-left: 15px; }
        .lb-avatar { width: 50px; height: 50px; border-radius: 50%; border: 2px solid; object-fit: cover; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .lb-name { font-size: 22px; font-weight: bold; font-family: inherit; }
        .lb-stats { text-align: right; display: flex; flex-direction: column; align-items: flex-end; }
        .lb-count { font-size: 26px; font-weight: bold; color: #fff; line-height: 1; font-family: inherit; }
        .lb-count-label { font-size: 11px; color: #6b7a62; text-transform: uppercase; font-family: sans-serif; font-weight: bold; letter-spacing: 1px; margin-top: 4px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online { background: #a6e3a1; box-shadow: 0 0 8px #a6e3a1; }
        .status-offline { background: #555; }
    </style>
</head>
<body>
    <div id="dynamic-bg"></div>
    <div class="loading-screen" id="loading-screen">Анализ данных профиля...</div>

    <nav class="top-nav">
        <!-- ЛЕВАЯ ЧАСТЬ -->
        <div style="display: flex; align-items: center; gap: 50px;">
            <div class="logo-dropdown">
                <div class="nav-logo-wrap">Skinwalker РђРЅРёРјРµ <span class="logo-arrow">в–ј</span></div>
                <div class="logo-dropdown-content">
                    <a href="index.html" class="logo-link active" style="--site-color: #a6e3a1;">
                        <span style="font-size: 14px;">в–¶</span> РђРЅРёРјРµ
                    </a>
                    <a href="../game/index.html" class="logo-link" style="--site-color: #ffd700;">
                        <span style="font-size: 14px;">▶</span> Игры
                    </a>
                </div>
            </div>
            
            <div style="display: flex; gap: 20px; align-items: center;">
                <a href="index.html" class="nav-btn btn-hub">Хаб</a>
                <a href="tierlist.html" class="nav-btn btn-tier">Тир-лист</a>
                <button onclick="window.openLeaderboard()" class="nav-btn" style="--btn-color: #89b4fa;">Зрители</button>
                
                <div class="visual-dropdown" id="visual-dropdown">
                    <button class="nav-btn btn-visual" onclick="toggleVisualMenu()">Визуал</button>
                    <div class="visual-dropdown-content">
                        <div class="role-toggles" style="margin: 0; justify-content: center; flex-wrap: wrap;">
                            <button id="toggle-streamer" class="role-toggle-btn active streamer" onclick="toggleRoleVis('streamer')">Стример</button>
                            <button id="toggle-me" class="role-toggle-btn active me" onclick="toggleRoleVis('me')">РЇ</button>
                            <button id="toggle-chat" class="role-toggle-btn active chat" onclick="toggleRoleVis('chat')">Чат</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    <script>
        const TWITCH_CLIENT_ID = 'gko3y2nhxg0ocvte0ru970pbau3eiq';
        const REDIRECT_URI = '../anime/index.html';
        const FIREBASE_BASE = 'https://skinwalkerauction-default-rtdb.europe-west1.firebasedatabase.app';
        let currentUser = null;
        let targetUserId = null;
        let radarChart = null;
        
        window.userAnimeData = { list: [], count: 0, sum: 0, th: {plot:0, vis:0, mus:0, wor:0, atm:0} };

        function getTierData(score) {
            const num = Number(score) || 0;
            if (num === 0) return { letter: '—', color: '#6b7a62', glow: 'none' };
            if (num >= 9.0) return { letter: 'S', color: '#ff4a4a', glow: '0 0 15px rgba(255, 74, 74, 0.8)' };
            if (num >= 8.0) return { letter: 'A', color: '#ffd700', glow: '0 0 15px rgba(255, 215, 0, 0.8)' };
            if (num >= 7.0) return { letter: 'B', color: '#cba6f7', glow: '0 0 15px rgba(203, 166, 247, 0.8)' };
            if (num >= 5.0) return { letter: 'C', color: '#89b4fa', glow: '0 0 15px rgba(137, 180, 250, 0.8)' };
            if (num >= 3.0) return { letter: 'D', color: '#a6e3a1', glow: '0 0 15px rgba(166, 227, 161, 0.8)' };
            return { letter: 'F', color: '#888888', glow: '0 0 15px rgba(136, 136, 136, 0.8)' };
        }

        if (typeof Chart !== 'undefined') { Chart.defaults.font.family = "'Neucha', cursive, sans-serif"; Chart.defaults.color = "#829c73"; }

        function loginTwitch() { window.location.href = `https://id.twitch.tv/oauth2/authorize?client_id=${TWITCH_CLIENT_ID}&redirect_uri=${REDIRECT_URI}&response_type=token&scope=`; }
        function logoutTwitch() { try { localStorage.removeItem('twitch_token'); } catch(e){} location.reload(); }

        function getUserInfo(username, fallbackTwitchColor) {
            const lowerName = username.toLowerCase();
            const dbUser = window.globalUsersDB ? window.globalUsersDB[lowerName] : null; 
            let r = "F"; let g = 0; let t = 0; let c = fallbackTwitchColor || '#a4b09c';
            if (dbUser) {
                if (dbUser.role) r = dbUser.role.toUpperCase();
                if (dbUser.wallet_gold) g = dbUser.wallet_gold;
                if (dbUser.wallet_tickets) t = dbUser.wallet_tickets;
                if (dbUser.color && dbUser.color.trim() !== "") c = dbUser.color;
            }
            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (r === 'SUB' || r === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`;
            else if (r === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;
            return { role: r, gold: g, tickets: t, color: c, badge: badgeHtml };
        }

        async function checkTwitchAuth() {
            try {
                const hash = window.location.hash;
                let token = null;
                try { token = localStorage.getItem('twitch_token'); } catch(e){}

                if (hash && hash.includes('access_token')) {
                    token = new URLSearchParams(hash.substring(1)).get('access_token');
                    try { localStorage.setItem('twitch_token', token); } catch(e){}
                    window.history.replaceState(null, null, window.location.pathname + window.location.search); 
                }

                if (token) {
                    const res = await fetch('https://api.twitch.tv/helix/users', { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                    if (res.status === 401) { try { localStorage.removeItem('twitch_token'); } catch(e){} return; }
                    currentUser = (await res.json()).data[0];

                    try {
                        const colorRes = await fetch(`https://api.twitch.tv/helix/chat/color?user_id=${currentUser.id}`, { headers: { 'Client-ID': TWITCH_CLIENT_ID, 'Authorization': `Bearer ${token}` } });
                        const colorData = await colorRes.json();
                        currentUser.color = (colorData.data && colorData.data[0] && colorData.data[0].color) ? colorData.data[0].color : null;
                    } catch(e) {}
                    
                    const uInfo = getUserInfo(currentUser.login, currentUser.color);
                    
                    document.getElementById('nav-auth').innerHTML = `
                        <div class="user-profile-neon">
                            <div class="avatar-glow-wrap" style="--user-color: ${uInfo.color}; cursor: pointer; transition: 0.2s;" onmouseover="this.style.transform='scale(1.1)'" onmouseout="this.style.transform='scale(1)'" onclick="window.location.href='profile.html?user=${currentUser.id}'" title="Мой профиль">
                                <img src="${currentUser.profile_image_url}" class="user-avatar">
                            </div>
                            <div class="profile-info">
                                <div class="profile-top">
                                    <span class="profile-name-top" style="color: ${uInfo.color}; text-shadow: 0 0 8px ${uInfo.color}; cursor: pointer; transition: 0.2s;" onmouseover="this.style.filter='brightness(1.3)'" onmouseout="this.style.filter='none'" onclick="window.location.href='profile.html?user=${currentUser.id}'" title="Мой профиль">${currentUser.display_name}</span>
                                    <button class="logout-neon" onclick="logoutTwitch()">Выйти</button>
                                </div>
                                <div class="profile-bottom">
                                    ${uInfo.badge}
                                    <div class="wallet-item" style="color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);">
                                        <img src="../icons/BILET_GOLD.png"> <span>${uInfo.gold}</span>
                                    </div>
                                    <div class="wallet-item" style="color: #a6e3a1; text-shadow: 0 0 10px rgba(166, 227, 161, 0.3);">
                                        <img src="../icons/BILET.png"> <span>${uInfo.tickets}</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                    startOnlineHeartbeat();
                }
            } catch (e) {}
        }

        function startOnlineHeartbeat() {
            if (!currentUser) return;
            const updateOnline = () => {
                const dbId = currentUser.login.toLowerCase();
                fetch(`${FIREBASE_BASE}/global_users/${dbId}/last_online.json`, {
                    method: 'PUT', body: JSON.stringify(Date.now())
                }).catch(e => console.log('Heartbeat error', e));
            };
            updateOnline(); 
            setInterval(updateOnline, 60000); 
        }

        function getScoreColor(score, alpha = 1) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `rgba(107, 122, 98, ${alpha})`; 
            let r, g, b;
            if (numScore <= 5.5) {
                let p = (numScore - 1) / 4.5; if (p < 0) p = 0;
                r = Math.round(205 + p * (210 - 205)); g = Math.round(115 + p * (215 - 115)); b = Math.round(50 + p * (220 - 50));
            } else {
                let p = (numScore - 5.5) / 4.5; if (p > 1) p = 1;
                r = Math.round(210 + p * (255 - 210)); g = Math.round(215 + p * (235 - 215)); b = Math.round(220 + p * (20 - 220));
            }
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function getScoreShadow(score, isLarge) {
            const numScore = Number(score);
            const base = isLarge ? '-1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 2px 2px 4px #000' : '1px 1px 2px #000';
            if (numScore === 0 || isNaN(numScore)) return base;
            const color = getScoreColor(score, 1);
            const blur1 = Math.round(1 + (numScore / 10) * 5); 
            let glow = `${base}, 0 0 ${blur1}px ${color}`;
            if (numScore >= 8) glow += `, 0 0 ${Math.round(blur1 * 1.5)}px ${color}`;
            if (numScore === 10) glow += `, 0 0 15px rgba(255,255,255,0.3)`; 
            return glow;
        }

        function getGlassRowStyle(score) {
            const numScore = Number(score);
            if (numScore === 0 || isNaN(numScore)) return `background: transparent; border-left: 2px solid rgba(107,122,98,0.3);`;
            const bg = getScoreColor(score, 0.1); const border = getScoreColor(score, 0.8);
            return `background: linear-gradient(90deg, ${bg} 0%, transparent 100%); border-left: 2px solid ${border};`;
        }

        async function initProfile() {
            const urlParams = new URLSearchParams(window.location.search);
            targetUserId = urlParams.get('user');
            if (!targetUserId) { document.getElementById('loading-screen').innerHTML = `<span style="color:#ff5555;">Пользователь не найден!</span>`; return; }

            try {
                const [usersRes, animeRes, commRes, gamesRes, gamesCommRes] = await Promise.all([
                    fetch(`${FIREBASE_BASE}/global_users.json`),
                    fetch(`${FIREBASE_BASE}/anime_db.json`),
                    fetch(`${FIREBASE_BASE}/community_db.json`),
                    fetch(`${FIREBASE_BASE}/games_db.json`),
                    fetch(`${FIREBASE_BASE}/games_community_db.json`)
                ]);

                const globalUsers = await usersRes.json() || {};
                const animeDb = await animeRes.json() || {};
                const commDb = await commRes.json() || {};
                const gamesDb = await gamesRes.json() || {};
                const gamesCommDb = await gamesCommRes.json() || {};
                
                window.globalUsersDB = globalUsers; 
                window.animeCommData = commDb;
                window.gamesCommData = gamesCommDb;

                await checkTwitchAuth();
                processData(targetUserId, globalUsers, animeDb, commDb, gamesDb, gamesCommDb);
                
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('main-layout').style.display = 'flex';
            } catch (e) {
                console.error(e);
                document.getElementById('loading-screen').innerHTML = `<span style="color:#ff5555;">Ошибка загрузки базы данных!</span>`;
            }
        }

        let previewRadarChart = null;

        function processData(userId, usersDb, animeDb, commDb, gamesDb, gamesCommDb) {
            let userName = "Неизвестный";
            let userAvatar = "https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png";
            let userColor = "#a6e3a1";
            const searchId = userId.toString().toLowerCase();

            for (const [franchise, seasons] of Object.entries(commDb)) {
                for (const [season, data] of Object.entries(seasons)) {
                    const animeInfo = animeDb[franchise] && animeDb[franchise][season] ? animeDb[franchise][season] : null;
                    if (!animeInfo) continue;

                    let r = null;
                    if (data.ratings) {
                        if (data.ratings[userId]) { r = data.ratings[userId]; } 
                        else {
                            const foundUid = Object.keys(data.ratings).find(uid => data.ratings[uid].displayName && data.ratings[uid].displayName.toLowerCase() === searchId);
                            if (foundUid) r = data.ratings[foundUid];
                        }
                    }

                    let commentText = null; let timestamp = 0;
                    if (data.comments) {
                        for (const [cId, c] of Object.entries(data.comments)) {
                            if (c.userId === userId || (c.displayName && c.displayName.toLowerCase() === searchId)) {
                                userName = c.displayName || userName; userAvatar = c.profileImage || userAvatar; userColor = c.userColor || userColor;
                                commentText = c.text; timestamp = Math.max(timestamp, c.timestamp);
                            }
                        }
                    }

                    if (r || commentText) {
                        if (r) {
                            userName = r.displayName || userName; userAvatar = r.profileImage || userAvatar;
                            if (r.overall > 0) {
                                window.userAnimeData.sum += r.overall;
                                window.userAnimeData.count++;
                                if (r.theory) {
                                    window.userAnimeData.th.plot += r.theory.plot || 0;
                                    window.userAnimeData.th.vis += r.theory.visuals || 0;
                                    window.userAnimeData.th.mus += r.theory.music || 0;
                                    window.userAnimeData.th.wor += r.theory.world || 0;
                                    window.userAnimeData.th.atm += r.theory.atmosphere || 0;
                                }
                                timestamp = Math.max(timestamp, r.timestamp);
                            }
                        }
                        window.userAnimeData.list.push({
                            title: animeInfo.title || franchise, cover: animeInfo.coverUrl, link: `Anime-Page.html?id=${franchise}`,
                            overall: r ? r.overall : 0, theory: r ? r.theory : null, comment: commentText, timestamp: timestamp
                        });
                    }
                }
            }

            for (const [gameId, data] of Object.entries(gamesCommDb)) {
                const gameInfo = gamesDb[gameId];
                if (!gameInfo) continue;

                let r = null;
                if (data.ratings) {
                    if (data.ratings[userId]) { r = data.ratings[userId]; } 
                    else {
                        const foundUid = Object.keys(data.ratings).find(uid => data.ratings[uid].displayName && data.ratings[uid].displayName.toLowerCase() === searchId);
                        if (foundUid) r = data.ratings[foundUid];
                    }
                }

                let commentText = null; let timestamp = 0;
                if (data.comments) {
                    for (const [cId, c] of Object.entries(data.comments)) {
                        if (c.userId === userId || (c.displayName && c.displayName.toLowerCase() === searchId)) {
                            userName = c.displayName || userName; userAvatar = c.profileImage || userAvatar; userColor = c.userColor || userColor;
                            commentText = c.text; timestamp = Math.max(timestamp, c.timestamp);
                        }
                    }
                }

                if (r || commentText) {
                    if (r) {
                        userName = r.displayName || userName; userAvatar = r.profileImage || userAvatar;
                        if (r.overall > 0) {
                            window.userGamesData.sum += r.overall;
                            window.userGamesData.count++;
                            if (r.theory) {
                                window.userGamesData.th.vis += r.theory.visuals || 0;
                                window.userGamesData.th.game += r.theory.gameplay || 0;
                                window.userGamesData.th.snd += r.theory.sound || 0;
                                window.userGamesData.th.tech += r.theory.tech || 0;
                                window.userGamesData.th.atm += r.theory.atmosphere || 0;
                            }
                            timestamp = Math.max(timestamp, r.timestamp);
                        }
                    }
                    window.userGamesData.list.push({
                        title: gameInfo.title || gameId, cover: gameInfo.coverUrl, link: `../game/games-page.html?id=${gameId}`,
                        overall: r ? r.overall : 0, theory: r ? r.theory : null, comment: commentText, timestamp: timestamp
                    });
                }
            }

            const finalLogin = userName === "Неизвестный" ? searchId : userName.toLowerCase();
            const dbUser = usersDb[finalLogin];
            let role = "F"; 
            if (dbUser) { 
                if (dbUser.role) role = dbUser.role.toUpperCase(); 
                if (dbUser.color) userColor = dbUser.color; 
                if (userName === "Неизвестный" && dbUser.display_name) userName = dbUser.display_name;
            }

            userColor = userColor || '#a6e3a1'; 

            let badgeHtml = `<span class="role-badge role-f">FOLLOW</span>`;
            if (role === 'SUB' || role === 'SUBSCRIBER') badgeHtml = `<span class="role-badge role-sub">SUB</span>`; else if (role === 'VIP') badgeHtml = `<span class="role-badge role-vip">VIP</span>`;

            let hex = userColor.replace('#', '');
            if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
            let uR = parseInt(hex.substring(0,2), 16) || 166;
            let uG = parseInt(hex.substring(2,4), 16) || 227;
            let uB = parseInt(hex.substring(4,6), 16) || 161;

            document.documentElement.style.setProperty('--user-color', userColor);
            document.documentElement.style.setProperty('--user-color-rgb', `${uR}, ${uG}, ${uB}`);
            
            document.getElementById('profile-card').innerHTML = `
                <div class="avatar-wrap"><img src="${userAvatar}" class="profile-avatar"></div>
                <div class="profile-name" style="color: ${userColor}; text-shadow: 0 0 15px ${userColor}80;">${userName}</div>
                <div class="badges-row">${badgeHtml}</div>
            `;

            switchTab('anime');
        }

        function updateLeftPanel(tabId) {
            const data = tabId === 'anime' ? window.userAnimeData : window.userGamesData;
            const count = data.count;
            const avg = count > 0 ? (data.sum / count).toFixed(1) : 0;
            
            document.getElementById('stat-ovr').innerText = avg;
            document.getElementById('stat-count').innerText = count;

            const th = data.th;
            const ctx = document.getElementById('radarChart').getContext('2d');
            const userColor = getComputedStyle(document.documentElement).getPropertyValue('--user-color').trim() || '#a6e3a1';
            
            let labels, avgT;
            if (tabId === 'anime') {
                labels = ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Персонажи'];
                avgT = count > 0 ? [(th.plot/count).toFixed(1), (th.vis/count).toFixed(1), (th.mus/count).toFixed(1), (th.wor/count).toFixed(1), (th.atm/count).toFixed(1)] : [0,0,0,0,0];
            } else {
                labels = ['Визуал', 'Геймплей', 'Звук', 'Техника', 'Атмосфера'];
                avgT = count > 0 ? [(th.vis/count).toFixed(1), (th.game/count).toFixed(1), (th.snd/count).toFixed(1), (th.tech/count).toFixed(1), (th.atm/count).toFixed(1)] : [0,0,0,0,0];
            }
            
            if(radarChart) radarChart.destroy();
            radarChart = new Chart(ctx, { 
                type: 'radar', 
                data: { labels: labels, datasets: [{ data: avgT, backgroundColor: `${userColor}33`, borderColor: userColor, pointBackgroundColor: userColor, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 4 }] }, 
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: '#283325' }, angleLines: { color: '#283325' }, pointLabels: { font: { size: 13, weight: 'bold' }, color: '#c4d1b8' } } } } 
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`tab-btn-${tabId}`).classList.add('active');
            removeChameleon();
            
            updateLeftPanel(tabId);
            renderRatings();
        }

        function renderRatings() {
            const sortType = document.getElementById('sort-ratings').value;
            const uColor = getComputedStyle(document.documentElement).getPropertyValue('--user-color').trim() || '#a6e3a1';

            const drawGrid = (dataObj, gridId, mediaType) => {
                let ratedList = dataObj.list.map((data, index) => ({ data, index })).filter(item => item.data.overall > 0);
                let uniqueList = []; const seen = new Set();
                ratedList.forEach(item => { if(!seen.has(item.data.title)) { seen.add(item.data.title); uniqueList.push(item); } });

                if (sortType === 'high') uniqueList.sort((a, b) => b.data.overall - a.data.overall);
                else if (sortType === 'low') uniqueList.sort((a, b) => a.data.overall - b.data.overall);
                else if (sortType === 'new') uniqueList.sort((a, b) => b.data.timestamp - a.data.timestamp);

                const container = document.getElementById(gridId);
                if (uniqueList.length === 0) { container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #6b7a62; font-size: 18px;">Пользователь еще ничего не оценил в этом разделе</div>`; return; }

                container.innerHTML = uniqueList.map(item => {
                    const f = item.data;
                    let scoreHtml = '';

                    if (mediaType === 'anime') {
                        const scoreColor = getScoreColor(f.overall, 1);
                        scoreHtml = `
                        <div class="score-box-mini" style="border-color: ${scoreColor}; box-shadow: 0 0 10px ${getScoreColor(f.overall, 0.4)}; padding: 4px 10px;">
                            <div class="tier-score-mini" style="color: ${scoreColor}; text-shadow: 0 0 8px ${scoreColor}; font-size: 22px;">${f.overall}</div>
                        </div>`;
                    } else {
                        const tier = getTierData(f.overall);
                        scoreHtml = `
                        <div class="score-box-mini" style="border-color: ${tier.color}; box-shadow: 0 0 10px ${tier.color}40; padding: 4px 12px;">
                            <div class="tier-score-mini" style="color: ${tier.color}; text-shadow: 0 0 8px ${tier.color}; font-size: 24px;">${tier.letter}</div>
                        </div>`;
                    }

                    return `
                    <div class="card-container anime-card" data-cover="${f.cover}" style="--card-color: ${uColor}; --card-border: ${uColor}40; --card-shadow: rgba(0,0,0,0.5); --card-shadow-hover: ${uColor}40;" onmouseenter="openPreview(${item.index}, '${mediaType}', this)" onmouseleave="closePreview()" onclick="window.location.href='${f.link}'">
                        <div class="card-face" style="background-image: url('${f.cover.replace(/'/g, "\\'")}');">
                            ${scoreHtml}
                            <div class="front-overlay">
                                <div class="anime-title">${f.title}</div>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            };

            drawGrid(window.userAnimeData, 'anime-grid', 'anime');
            drawGrid(window.userGamesData, 'games-grid', 'game');
            extractColors();
        }

        function extractColors() {
            if (typeof ColorThief === 'undefined') return;
            const colorThief = new ColorThief();
            document.querySelectorAll('.anime-card').forEach(card => {
                const imgUrl = card.getAttribute('data-cover');
                if (!imgUrl) return;
                const hiddenImg = new Image();
                hiddenImg.crossOrigin = 'Anonymous';
                hiddenImg.onload = function() {
                    try {
                        const color = colorThief.getColor(hiddenImg);
                        let r = color[0], g = color[1], b = color[2];
                        const luminance = (0.299 * r + 0.587 * g + 0.114 * b);
                        let tr = r, tg = g, tb = b;
                        if (luminance < 90) { tr = Math.min(255, r + 80); tg = Math.min(255, g + 80); tb = Math.min(255, b + 80); }

                        card.style.setProperty('--card-color', `rgb(${r}, ${g}, ${b})`);
                        card.style.setProperty('--card-border', `rgba(${r}, ${g}, ${b}, 0.6)`);
                        card.style.setProperty('--card-shadow', `rgba(${r}, ${g}, ${b}, 0.2)`);
                        card.style.setProperty('--card-shadow-hover', `rgba(${r}, ${g}, ${b}, 0.8)`);
                        card.style.setProperty('--theme-light', `rgb(${tr}, ${tg}, ${tb})`); 
                        card.dataset.rgb = `${tr}, ${tg}, ${tb}`;
                    } catch(e) {}
                };
                hiddenImg.src = imgUrl + '?bypassCache=' + Date.now();
            });
        }

        function removeChameleon() {
            document.getElementById('dynamic-bg').classList.remove('active');
            const uColor = document.documentElement.style.getPropertyValue('--user-color').trim() || '#a6e3a1';
            document.documentElement.style.setProperty('--theme-primary', uColor);
            document.documentElement.style.setProperty('--theme-glow', `${uColor}80`);
            document.documentElement.style.setProperty('--theme-panel-border', '#283325');
            
            const panel = document.getElementById('dynamic-right-panel');
            if (panel) { panel.style.borderColor = `rgba(166, 227, 161, 0.3)`; panel.style.boxShadow = `0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(166, 227, 161, 0.05)`; }
        }

        function closePreview() { removeChameleon(); }

        function openPreview(index, mediaType, cardElem) {
            const data = mediaType === 'anime' ? window.userAnimeData.list[index] : window.userGamesData.list[index];
            if (!data) return;

            document.getElementById('preview-placeholder').style.display = 'none';
            document.getElementById('preview-container').style.display = 'flex';
            
            document.getElementById('preview-cover').src = data.cover;
            document.getElementById('preview-title').innerText = data.title;
            
            if (mediaType === 'anime') {
                const sColor = getScoreColor(data.overall, 1);
                document.getElementById('preview-score-box').style.cssText = `background: ${getScoreColor(data.overall, 0.15)}; border: 1px solid ${getScoreColor(data.overall, 0.6)}; box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 15px ${getScoreColor(data.overall, 0.15)}; border-radius: 8px; padding: 8px; text-align: center; backdrop-filter: blur(5px);`;
                document.getElementById('preview-score-label').style.cssText = `color: ${sColor}; text-shadow: 0 0 5px ${getScoreColor(data.overall, 0.5)};`;
                document.getElementById('preview-overall').innerHTML = `${data.overall > 0 ? data.overall : '-'}<span> / 10</span>`;
                document.getElementById('preview-overall').style.cssText = `color: #fff; font-size: 45px; font-weight: bold; line-height: 1; text-shadow: ${getScoreShadow(data.overall, true)}; font-family: 'Neucha', cursive, sans-serif !important;`;
            } else {
                const tier = getTierData(data.overall);
                document.getElementById('preview-score-box').style.cssText = `background: ${tier.color}15; border: 1px solid ${tier.color}60; box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 15px ${tier.color}15; border-radius: 8px; padding: 8px; text-align: center; backdrop-filter: blur(5px);`;
                document.getElementById('preview-score-label').style.cssText = `color: ${tier.color}; text-shadow: 0 0 5px ${tier.color}80;`;
                document.getElementById('preview-overall').innerHTML = tier.letter;
                document.getElementById('preview-overall').style.cssText = `color: ${tier.color}; font-size: 55px; font-weight: bold; line-height: 1; text-shadow: ${tier.glow}; font-family: 'Neucha', cursive, sans-serif !important;`;
            }
            
            document.getElementById('preview-comment').innerHTML = data.comment ? `"${data.comment.replace(/\n/g, '<br>')}"` : '<span style="opacity:0.5; font-style: normal;">Только оценка, без рецензии.</span>';

            const createRow = (name, val) => `<div class="preview-crit-row" style="${getGlassRowStyle(val)}"><span style="color:${getScoreColor(val, 1)}; text-shadow: 1px 1px 2px #000;">${name}</span><span style="color:#fff; text-shadow: ${getScoreShadow(val, false)};">${val || '-'}</span></div>`;

            let chartLabels = [], chartData = [], avgTh = 0;
            const t = data.theory || (mediaType === 'anime' ? {plot:0, visuals:0, music:0, world:0, atmosphere:0} : {vis:0, game:0, snd:0, tech:0, atm:0});

            if (mediaType === 'anime') {
                avgTh = ((t.plot||0) + (t.visuals||0) + (t.music||0) + (t.world||0) + (t.atmosphere||0)) / 5;
                document.getElementById('preview-theory-list').innerHTML = createRow('Сюжет', t.plot) + createRow('Визуал', t.visuals) + createRow('Музыка', t.music) + createRow('Мир', t.world) + createRow('Персонажи', t.atmosphere);
                chartLabels = ['Сюжет', 'Визуал', 'Музыка', 'Мир', 'Персонажи'];
                chartData = [t.plot||0, t.visuals||0, t.music||0, t.world||0, t.atmosphere||0];
            } else {
                avgTh = ((t.visuals||0) + (t.gameplay||0) + (t.sound||0) + (t.tech||0) + (t.atmosphere||0)) / 5;
                document.getElementById('preview-theory-list').innerHTML = createRow('Визуал', t.visuals) + createRow('Геймплей', t.gameplay) + createRow('Звук', t.sound) + createRow('Техника', t.tech) + createRow('Атмосфера', t.atmosphere);
                chartLabels = ['Визуал', 'Геймплей', 'Звук', 'Техника', 'Атмосфера'];
                chartData = [t.visuals||0, t.gameplay||0, t.sound||0, t.tech||0, t.atmosphere||0];
            }

            document.getElementById('preview-avg-theory').innerText = `Ср. критерий: ${avgTh > 0 ? avgTh.toFixed(1) : '-'}`;
            document.getElementById('preview-avg-theory').style.color = getScoreColor(avgTh, 1);
            document.getElementById('preview-avg-theory').style.textShadow = getScoreShadow(avgTh, false);

            const bg = document.getElementById('dynamic-bg');
            bg.style.backgroundImage = `url('${data.cover}')`;
            bg.classList.add('active');

            let themeColor = getComputedStyle(document.documentElement).getPropertyValue('--user-color').trim() || '#a6e3a1';
            let rawColor = themeColor;

            if (cardElem && cardElem.dataset.rgb) {
                const rgb = cardElem.dataset.rgb;
                themeColor = `rgb(${rgb})`;
                rawColor = `rgba(${rgb}, 0.8)`;
                
                document.documentElement.style.setProperty('--theme-primary', themeColor);
                document.documentElement.style.setProperty('--theme-glow', `rgba(${rgb}, 0.5)`);
                document.documentElement.style.setProperty('--theme-panel-border', `rgba(${rgb}, 0.4)`);
            }

            const panel = document.getElementById('dynamic-right-panel');
            panel.style.borderColor = rawColor;
            panel.style.boxShadow = `0 10px 30px rgba(0,0,0,0.8), 0 0 20px ${rawColor.replace('0.8', '0.3')}`;

            document.getElementById('preview-cover').style.borderColor = themeColor;
            document.getElementById('preview-comment').style.borderColor = themeColor;
            document.getElementById('preview-title').style.color = themeColor;
            document.getElementById('preview-title').style.textShadow = `2px 2px 5px #000, 0 0 10px ${rawColor.replace('0.8', '0.5')}`;

            const ctx = document.getElementById('previewChart').getContext('2d');
            if (previewRadarChart) {
                previewRadarChart.data.labels = chartLabels;
                previewRadarChart.data.datasets[0].data = chartData;
                previewRadarChart.data.datasets[0].borderColor = themeColor;
                previewRadarChart.data.datasets[0].backgroundColor = rawColor.replace('0.8', '0.2');
                previewRadarChart.data.datasets[0].pointBackgroundColor = themeColor;
                previewRadarChart.update();
            } else {
                previewRadarChart = new Chart(ctx, {
                    type: 'radar',
                    data: { labels: chartLabels, datasets: [{ data: chartData, backgroundColor: rawColor.replace('0.8', '0.2'), borderColor: themeColor, pointBackgroundColor: themeColor, pointBorderColor: '#0b0d0a', borderWidth: 2, pointRadius: 2 }] },
                    options: { animation: false, responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { filter: (i) => i.raw > 0 } }, scales: { r: { min: 0, max: 10, ticks: { display: false, stepSize: 2 }, grid: { color: 'rgba(255,255,255,0.1)' }, angleLines: { color: 'rgba(255,255,255,0.1)' }, pointLabels: { font: { size: 11, weight: 'bold' }, color: '#c4d1b8' } } } }
                });
            }
        }

        let visRoles = JSON.parse(localStorage.getItem('skinwalker_games_roles')) || { streamer: true, me: true, chat: true };

        function toggleVisualMenu() { document.getElementById('visual-dropdown').classList.toggle('show'); }
        window.addEventListener('click', function(e) {
            if (!document.getElementById('visual-dropdown').contains(e.target)) {
                document.getElementById('visual-dropdown').classList.remove('show');
            }
        });

        function toggleRoleVis(role) {
            visRoles[role] = !visRoles[role];
            localStorage.setItem('skinwalker_games_roles', JSON.stringify(visRoles));
            document.getElementById(`toggle-${role}`).classList.toggle('active', visRoles[role]);
            if (typeof updateProfileVisuals === 'function') updateProfileVisuals();
        }

        window.addEventListener('DOMContentLoaded', () => {
            Object.keys(visRoles).forEach(role => {
                const btn = document.getElementById(`toggle-${role}`);
                if (btn) btn.classList.toggle('active', visRoles[role]);
            });
        });

        let lbAllUsers = [];

        window.openLeaderboard = async function() {
            try {
                if (!window.globalCommData) {
                    const btn = document.querySelector('button[onclick="window.openLeaderboard()"]');
                    const oldText = btn ? btn.innerText : 'Зрители';
                    if (btn) btn.innerText = "Загрузка...";
                    
                    const res = await fetch(`${FIREBASE_BASE}/games_community_db.json`);
                    window.globalCommData = await res.json() || {};
                    
                    if (btn) btn.innerText = oldText;
                }

                const userStats = {};
                if (window.globalCommData && typeof window.globalCommData === 'object') {
                    for (const [gameId, gameData] of Object.entries(window.globalCommData)) {
                        if (gameData && gameData.ratings && typeof gameData.ratings === 'object') { 
                            for (const [userId, rating] of Object.entries(gameData.ratings)) {
                                if (!rating) continue; 
                                if ((Number(rating.overall) > 0) || (rating.theory && Object.values(rating.theory).some(v => Number(v) > 0))) {
                                    if (!userStats[userId]) { 
                                        userStats[userId] = { id: userId, name: rating.displayName || userId, avatar: rating.profileImage || 'https://static-cdn.jtvnw.net/user-default-pictures-uv/41780b5a-def8-11e9-94d9-784f43822e80-profile_image-70x70.png', count: 0 }; 
                                    }
                                    userStats[userId].count++;
                                    if (rating.displayName) userStats[userId].name = rating.displayName;
                                    if (rating.profileImage) userStats[userId].avatar = rating.profileImage;
                                }
                            }
                        }
                    }
                }
                
                lbAllUsers = Object.values(userStats).sort((a, b) => b.count - a.count);
                const searchInput = document.getElementById('lb-search');
                if (searchInput) searchInput.value = '';
                
                window.renderLeaderboard(lbAllUsers);
                
                const modal = document.getElementById('leaderboard-modal');
                if (modal) modal.style.display = 'flex';
                
            } catch(e) { console.error("Ошибка при сборке Зала Славы:", e); }
        };

        window.renderLeaderboard = function(usersArray) {
            const listEl = document.getElementById('leaderboard-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            if (usersArray.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; color: #6b7a62; padding: 30px; font-size: 18px;">Никого не найдено.</div>'; 
                return;
            }
            usersArray.forEach((u) => {
                const originalIndex = lbAllUsers.findIndex(orig => orig.id === u.id);
                const rank = originalIndex + 1;
                let rankClass = ''; let crown = rank;
                if (rank === 1) { rankClass = 'top-1'; crown = 'рџ'''; }
                else if (rank === 2) { rankClass = 'top-2'; crown = '🥈'; }
                else if (rank === 3) { rankClass = 'top-3'; crown = '🥉'; }
                const safeName = (u.name || '').toString().toLowerCase();
                const dbUser = window.globalUsersDB ? window.globalUsersDB[safeName] : null;
                const color = (dbUser && dbUser.color) ? dbUser.color : '#a4b09c';
                const isOnline = dbUser && dbUser.last_online && (Date.now() - dbUser.last_online < 150000);
                const statusDot = isOnline ? '<div class="status-dot status-online" style="display:inline-block; margin-right:6px;"></div><span style="color:#a6e3a1; font-size:13px; font-family:sans-serif;">В сети</span>' : '<div class="status-dot status-offline" style="display:inline-block; margin-right:6px;"></div><span style="color:#6b7a62; font-size:13px; font-family:sans-serif;">Не в сети</span>';
                const html = `
                <a href="profile.html?user=${u.id}" class="lb-item">
                    <div class="lb-rank ${rankClass}">${crown}</div>
                    <div class="lb-user">
                        <img src="${u.avatar}" class="lb-avatar" style="border-color: ${color};">
                        <div style="display: flex; flex-direction: column; gap: 4px;">
                            <div class="lb-name" style="color: ${color}; text-shadow: 0 0 8px ${color}80; line-height: 1;">${u.name}</div>
                            <div style="display: flex; align-items: center;">${statusDot}</div>
                        </div>
                    </div>
                    <div class="lb-stats"><div class="lb-count">${u.count}</div><div class="lb-count-label">оценок</div></div>
                </a>`;
                listEl.insertAdjacentHTML('beforeend', html);
            });
        };

        window.filterLeaderboard = function() {
            const searchInput = document.getElementById('lb-search');
            if (!searchInput) return;
            const query = searchInput.value.toLowerCase().trim();
            if (!query) { window.renderLeaderboard(lbAllUsers); return; }
            const filtered = lbAllUsers.filter(u => (u.name || '').toString().toLowerCase().includes(query));
            window.renderLeaderboard(filtered);
        };

        window.onload = initProfile;
    </script>
</body>
</html>
