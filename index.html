<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skinwalker Sites</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Arial, sans-serif;
            background: #0b0d0a;
            color: #d7dfd1;
        }

        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            place-items: center;
        }

        main {
            width: min(720px, calc(100% - 32px));
            text-align: center;
        }

        h1 {
            margin-bottom: 12px;
            color: #b8a87b;
        }

        p {
            color: #a4b09c;
        }

        nav {
            display: grid;
            gap: 14px;
            margin-top: 32px;
        }

        a {
            padding: 18px 22px;
            border: 1px solid #4a5c41;
            border-radius: 10px;
            color: #d7dfd1;
            background: #121612;
            text-decoration: none;
            transition: border-color 0.2s, transform 0.2s;
        }

        a:hover,
        a:focus-visible {
            border-color: #a6e3a1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <main>
        <h1>Skinwalker</h1>
        <p>Выберите нужный раздел</p>
        <nav aria-label="Разделы сайта">
            <a href="./auction/">Аукцион</a>
            <a href="./game/">Игры</a>
            <a href="./anime/">РђРЅРёРјРµ</a>
        </nav>
    </main>
</body>
</html>
